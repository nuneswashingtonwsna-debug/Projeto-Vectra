function nextMonthDays(){const n=new Date();const first=new Date(n.getFullYear(),n.getMonth()+1,1,12);return Math.max(0,Math.ceil((first-new Date(n.getFullYear(),n.getMonth(),n.getDate(),12))/86400000))}
function themeHistoryHtml(){const rows=[];Object.entries(S.tests).sort().forEach(([month,r])=>Object.entries(r.themes||{}).forEach(([theme,v])=>rows.push(`<tr><td>${month}</td><td>${esc(theme)}</td><td>${Math.round(v.right/v.total*100)}%</td></tr>`)));return rows.length?`<table><thead><tr><th>Mês</th><th>Tema</th><th>Acerto</th></tr></thead><tbody>${rows.slice(-30).join('')}</tbody></table>`:'<p class="muted">A evolução aparecerá após o primeiro teste.</p>'}
function logicHistoryHtml(){const rows=Object.entries(S.logicHistory).sort().reverse().slice(0,8).map(([week,r])=>`<div class="entry"><b>Semana de ${br(week)}</b>: ${r.score}/3</div>`);return rows.join('')||'<p class="muted">Nenhum desafio concluído.</p>'}
function renderTests(){if(testRun)return renderTestRun();if(logicRun)return renderLogicRun();const completed=S.tests[monthKey()],available=allQuestions().filter(q=>q.nivel===S.settings.level).length>=10,history=Object.entries(S.tests).sort().slice(-8),bars=history.length?`<div class="bars">${history.map(([m,r])=>`<div class="bar" style="height:${Math.max(5,r.score)}%"><span>${r.score}%</span><small>${m.slice(5)}</small></div>`).join('')}</div>`:'<p class="muted">Ainda não há notas.</p>',lastExt=S.externalTests.length?S.externalTests[S.externalTests.length-1].date:S.settings.startDate,extDue=daysBetween(lastExt,iso())>=90,logicDone=S.logicHistory[weekKey()],sunday=new Date().getDay()===0;document.getElementById('teste').innerHTML=`<h1>Testes</h1><div class="card hero"><h2>Teste mensal</h2>${completed?`<p>✅ Teste de ${monthKey()} concluído: <b>${completed.score}%</b>.</p><p>Próximo teste em ${nextMonthDays()} dias.</p>`:`<p><b>Teste do mês disponível</b></p><p>10 perguntas • ${S.settings.testMinutes} minutos • mínimo ${S.settings.passPercent}%</p><button ${available?'':'disabled'} onclick="startTest()">Começar teste</button>${available?'':'<p class="small muted">Importe perguntas suficientes para este nível.</p>'}`}</div><div class="card"><h2>Histórico de notas</h2>${bars}</div><div class="card"><h2>Evolução por tema</h2>${themeHistoryHtml()}</div><div class="card"><h2>Desafio de lógica semanal</h2><p>3 questões originais • ${S.settings.logicMinutes} minutos • não afeta a chama.</p>${logicDone?`<p>✅ Feito nesta semana: ${logicDone.score}/3</p>`:sunday?'<button onclick="startLogic()">Começar desafio</button>':`<p class="muted">Disponível no domingo. Faltam ${daysToSunday()} dia(s).</p>`}<h3>Histórico de acertos</h3>${logicHistoryHtml()}</div>${extDue?'<div class="card notice"><b>Hora de fazer um teste externo para conferir seu nível.</b></div>':''}<div class="card"><h2>Registrar teste externo</h2><div class="field"><label>Data</label><input id="extDate" type="date" value="${iso()}"></div><div class="field"><label>Nome do teste</label><input id="extName" placeholder="Nome livre"></div><div class="field"><label>Nível obtido</label><select id="extLevel">${['A1','A2','B1','B2','C1','C2'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Observação</label><textarea id="extObs"></textarea></div><button onclick="addExternal()">Salvar resultado</button>${S.externalTests.slice().reverse().map((x,i)=>`<div class="entry"><b>${br(x.date)} • ${esc(x.name)}</b><br>${x.level} — ${esc(x.obs)}</div>`).join('')}</div><div class="card"><h2>Importar perguntas</h2><p class="small muted">Cole um JSON com uma pergunta ou uma lista no formato do banco.</p><div class="field"><textarea id="importQuestions" placeholder='[{"nivel":"A1","tema":"verbos","pergunta":"Complete: I am ready to begin.","opcoes":["am","is","are","be"],"correta":0,"explicacao":"Com I, usamos am."}]'></textarea></div><button class="secondary" onclick="importQuestions()">Validar e adicionar</button></div>`}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function startTest(){const qs=shuffle(allQuestions().filter(q=>q.nivel===S.settings.level)).slice(0,10);testRun={qs,index:0,answers:[],remaining:S.settings.testMinutes*60,locked:false,feedback:''};startTimer('test');renderTestRun()}
function startTimer(type){clearInterval(timerId);timerId=setInterval(()=>{const r=type==='test'?testRun:logicRun;if(!r)return clearInterval(timerId);r.remaining--;const e=document.getElementById('timeLeft');if(e)e.textContent=formatTime(r.remaining);if(r.remaining<=0){clearInterval(timerId);type==='test'?finishTest(true):finishLogic(true)}},1000)}
function formatTime(s){return pad(Math.floor(Math.max(0,s)/60))+':'+pad(Math.max(0,s)%60)}
function renderTestRun(){const r=testRun,q=r.qs[r.index];document.getElementById('teste').innerHTML=`<div class="row between"><h1>Teste mensal</h1><span id="timeLeft" class="timer">${formatTime(r.remaining)}</span></div><div class="dots">${r.qs.map((_,i)=>`<i class="dot ${i<r.index?'done':i===r.index?'current':''}"></i>`).join('')}</div><div class="card"><span class="tag">${esc(q.tema)} • ${r.index+1}/10</span><h2>${esc(q.pergunta)}</h2><div class="stack">${q.opcoes.map((o,i)=>`<button class="qopt ${r.locked?(i===q.correta?'correct':i===r.chosen?'wrong':''):''}" ${r.locked?'disabled':''} onclick="answerTest(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>${r.locked?`<div class="card notice" style="margin-top:12px"><b>${r.chosen===q.correta?'Correto!':'Resposta correta: '+esc(q.opcoes[q.correta])}</b><p>${esc(q.explicacao)}</p></div><button onclick="nextTest()">${r.index===9?'Ver resultado':'Próxima pergunta'}</button>`:''}</div>`}
function answerTest(i){if(!testRun||testRun.locked)return;testRun.locked=true;testRun.chosen=i;testRun.answers.push({q:testRun.qs[testRun.index],chosen:i,correct:i===testRun.qs[testRun.index].correta});renderTestRun()}
function nextTest(){if(testRun.index===testRun.qs.length-1)return finishTest(false);testRun.index++;testRun.locked=false;renderTestRun()}
function finishTest(timeout){if(!testRun)return;if(timeout&&testRun.answers.length<testRun.qs.length){for(let i=testRun.answers.length;i<testRun.qs.length;i++)testRun.answers.push({q:testRun.qs[i],chosen:null,correct:false})}clearInterval(timerId);const total=testRun.qs.length,correct=testRun.answers.filter(a=>a.correct).length,score=Math.round(correct/total*100),themes={};testRun.answers.forEach(a=>{const t=a.q.tema;themes[t]??={right:0,total:0};themes[t].total++;if(a.correct)themes[t].right++});S.tests[monthKey()]={date:iso(),score,correct,total,themes};save();const weak=Object.entries(themes).sort((a,b)=>a[1].right/a[1].total-b[1].right/b[1].total).slice(0,2).map(x=>x[0]);testRun=null;renderTests();openModal(`<h2>Resultado: ${score}%</h2><p class="big center">${score>=S.settings.passPercent?'✅':'📚'}</p><p class="center"><b>${score>=S.settings.passPercent?'Dentro do esperado':'Reforçar'}</b></p><p>${correct} de ${total} respostas corretas${timeout?' • tempo encerrado':''}.</p><h3>Temas mais fracos</h3><p>${weak.map(esc).join(' e ')}</p><h3>Desempenho por tema</h3>${Object.entries(themes).map(([t,v])=>`<p>${esc(t)}: ${v.right}/${v.total}</p>`).join('')}<button onclick="closeModal()">Fechar</button>`)}
function weekKey(){const d=new Date(),day=d.getDay(),sun=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day,12);return iso(sun)}
function daysToSunday(){const d=new Date().getDay();return d===0?0:7-d}
function startLogic(){logicRun={qs:shuffle(LOGIC).slice(0,3),index:0,answers:[],remaining:S.settings.logicMinutes*60,locked:false};startTimer('logic');renderLogicRun()}
function renderLogicRun(){const r=logicRun,q=r.qs[r.index];document.getElementById('teste').innerHTML=`<div class="row between"><h1>Lógica</h1><span id="timeLeft" class="timer">${formatTime(r.remaining)}</span></div><div class="card"><span class="tag">Questão ${r.index+1}/3</span><h2>${esc(q.pergunta)}</h2><div class="stack">${q.opcoes.map((o,i)=>`<button class="qopt ${r.locked?(i===q.correta?'correct':i===r.chosen?'wrong':''):''}" ${r.locked?'disabled':''} onclick="answerLogic(${i})">${esc(o)}</button>`).join('')}</div>${r.locked?`<div class="card notice" style="margin-top:12px"><p>${esc(q.explicacao)}</p></div><button onclick="nextLogic()">${r.index===2?'Ver resultado':'Próxima'}</button>`:''}</div>`}
function answerLogic(i){if(!logicRun||logicRun.locked)return;logicRun.locked=true;logicRun.chosen=i;logicRun.answers.push(i===logicRun.qs[logicRun.index].correta);renderLogicRun()}
function nextLogic(){if(logicRun.index===2)return finishLogic(false);logicRun.index++;logicRun.locked=false;renderLogicRun()}
function finishLogic(timeout){if(!logicRun)return;clearInterval(timerId);while(logicRun.answers.length<3)logicRun.answers.push(false);const score=logicRun.answers.filter(Boolean).length;S.logicHistory[weekKey()]={date:iso(),score};logicRun=null;save();renderTests();openModal(`<h2>Desafio concluído</h2><p class="big center">${score}/3</p><p>${timeout?'O tempo terminou. ':''}Continue treinando padrões e dedução.</p><button onclick="closeModal()">Fechar</button>`)}
function addExternal(){const date=document.getElementById('extDate').value,name=document.getElementById('extName').value.trim(),level=document.getElementById('extLevel').value,obs=document.getElementById('extObs').value.trim();if(!date||!name)return toast('Preencha data e nome do teste.');S.externalTests.push({date,name,level,obs});S.externalTests.sort((a,b)=>a.date.localeCompare(b.date));save();renderTests();toast('Teste externo salvo.')}
function importQuestions(){let data;try{data=JSON.parse(document.getElementById('importQuestions').value)}catch(e){return toast('JSON inválido.')}if(!Array.isArray(data))data=[data];const themes=['verbos','vocabulário','preposições','pronomes','conectivos','modais','interpretação de texto'];const valid=data.every(q=>q&&LEVELS.includes(q.nivel)&&themes.includes(q.tema)&&typeof q.pergunta==='string'&&Array.isArray(q.opcoes)&&q.opcoes.length>=2&&Number.isInteger(q.correta)&&q.correta>=0&&q.correta<q.opcoes.length&&typeof q.explicacao==='string');if(!valid)return toast('Formato inválido. Confira nível, tema, opções e resposta.');S.importedQuestions.push(...data);save();renderTests();toast(`${data.length} pergunta(s) adicionada(s).`)}
function diaryFiltered(){const q=(document.getElementById('diarySearch')?.value||'').toLowerCase();return S.diary.slice().reverse().filter(x=>(x.feedback+' '+x.words+' '+x.sentence).toLowerCase().includes(q))}
function renderDiaryEntries(){const el=document.getElementById('diaryEntries');if(el)el.innerHTML=diaryFiltered().map(x=>`<div class="entry"><b>${br(x.date)}</b><p>${esc(x.feedback)}</p>${x.words?`<span class="tag">${esc(x.words)}</span>`:''}${x.sentence?`<p class="small">Minha frase: ${esc(x.sentence)}</p>`:''}</div>`).join('')||'<p class="muted">Nenhum registro encontrado.</p>'}
function listItems(arr,type){const q=(document.getElementById(type+'Search')?.value||'').toLowerCase();return arr.map((x,i)=>({...x,_i:i})).filter(x=>(x.text||'').toLowerCase().includes(q)).reverse().map(x=>`<div class="entry row between"><span>${esc(x.text)} <small class="muted">${br(x.date)}</small></span><button class="tiny danger" onclick="deleteItem('${type}',${x._i})">Apagar</button></div>`).join('')||'<p class="muted">Lista vazia.</p>'}
function renderItemList(type){const el=document.getElementById(type+'List');if(el)el.innerHTML=listItems(type==='errors'?S.errors:S.newWords,type)}
function addItem(type){const input=document.getElementById(type+'Input'),text=input.value.trim();if(!text)return;const arr=type==='errors'?S.errors:S.newWords;arr.push({text,date:iso()});input.value='';save();renderItemList(type)}
function deleteItem(type,i){(type==='errors'?S.errors:S.newWords).splice(i,1);save();renderItemList(type)}
function reviewPrompt(){const from=addDays(iso(),-6),words=S.newWords.filter(x=>x.date>=from).map(x=>x.text),errors=S.errors.filter(x=>x.date>=from).map(x=>x.text);return `Create a mini English review quiz for me using these items from the last 7 days. Words: ${words.join(', ')||'no saved words yet'}. Mistakes: ${errors.join('; ')||'no saved mistakes yet'}. Ask exactly 10 questions, ONE at a time. Mix correction, fill-in-the-blank, translation, and a short job-interview answer. Wait for my answer before the next question. After each answer, explain briefly in Portuguese. At the end, show my score and the 3 items I should review most. Start with question 1.`}
function copyAllDiary(){const text=['DIÁRIO DE INGLÊS',...S.diary.map(x=>`${br(x.date)}\nFEEDBACK: ${x.feedback}\nPALAVRAS: ${x.words}\nFRASE: ${x.sentence}`),'ERROS RECORRENTES',...S.errors.map(x=>`${br(x.date)} — ${x.text}`),'PALAVRAS NOVAS',...S.newWords.map(x=>`${br(x.date)} — ${x.text}`)].join('\n\n');copyText(text,'Diário copiado!')}
function renderMore(){const backupDue=!S.lastBackup||daysBetween(S.lastBackup,iso())>=7;document.getElementById('mais').innerHTML=`<h1>Mais</h1>${backupDue?'<div class="card notice"><b>📦 Lembrete: faça uma cópia de segurança dos seus dados.</b></div>':''}<details open><summary>📔 Diário</summary><div><div class="field"><input id="diarySearch" placeholder="Buscar feedbacks" oninput="renderDiaryEntries()"></div><div class="grid2"><button onclick="copyAllDiary()">Copiar tudo</button><button class="secondary" onclick="copyText(reviewPrompt(),'Prompt de revisão copiado!')">Copiar prompt de revisão</button></div><div id="diaryEntries"></div><h3>Erros recorrentes</h3><div class="row"><input id="errorsInput" style="min-height:48px;width:100%;border:2px solid var(--line);border-radius:13px;background:var(--bg);padding:10px" placeholder="Adicionar erro"><button class="tiny" onclick="addItem('errors')">Adicionar</button></div><div class="field"><input id="errorsSearch" placeholder="Buscar erros" oninput="renderItemList('errors')"></div><div id="errorsList"></div><h3>Palavras novas</h3><div class="row"><input id="newWordsInput" style="min-height:48px;width:100%;border:2px solid var(--line);border-radius:13px;background:var(--bg);padding:10px" placeholder="Adicionar palavra"><button class="tiny" onclick="addItem('newWords')">Adicionar</button></div><div class="field"><input id="newWordsSearch" placeholder="Buscar palavras" oninput="renderItemList('newWords')"></div><div id="newWordsList"></div><h3>Músicas e cenas feitas</h3>${S.mediaDone.slice().reverse().map(x=>`<div class="entry">✅ ${esc(x.title)} — ${esc(x.source)} <small>${br(x.date)}</small></div>`).join('')||'<p class="muted">Nenhuma ainda.</p>'}<h3>Favoritos</h3>${S.favorites.map(x=>`<div class="entry">⭐ ${esc(x.title)} — ${esc(x.source)}</div>`).join('')||'<p class="muted">Nenhum ainda.</p>'}</div></details><details><summary>⚙️ Configurações</summary><div>${settingsForm()}<button class="good" onclick="saveSettings()">Salvar configurações</button></div></details><details><summary>📦 Backup e restauração</summary><div><button onclick="copyBackup()">Copiar backup</button><div class="field"><label>Colar backup</label><textarea id="backupBox" placeholder="Cole aqui o JSON do backup"></textarea></div><button class="secondary" onclick="restoreBackup()">Restaurar</button></div></details><details><summary>🧹 Zerar tudo</summary><div><p>Apaga progresso, diário, testes e configurações deste navegador.</p><button class="danger" onclick="resetAll()">Zerar tudo</button></div></details>`;renderDiaryEntries();renderItemList('errors');renderItemList('newWords')}
function settingsForm(){const o=LEVELS.map(x=>`<option ${S.settings.level===x?'selected':''}>${x}</option>`).join('');return `<div class="field"><label>Nível atual</label><select id="cfgLevel">${o}</select></div><div class="grid2"><div class="field"><label>Módulo</label><input id="cfgModule" type="number" min="1" value="${S.settings.module}"></div><div class="field"><label>Aula</label><input id="cfgLesson" type="number" min="1" value="${S.settings.lesson}"></div></div><div class="field"><label>Aulas feitas no nível</label><input id="cfgDone" type="number" min="0" value="${S.settings.lessonsDone}"></div><h3>Total de aulas por nível</h3><div class="grid2">${LEVELS.map(l=>`<div class="field"><label>${l}</label><input id="cfgTotal${l}" type="number" min="1" value="${S.settings.totals[l]}"></div>`).join('')}</div><div class="grid2"><div class="field"><label>Data de início</label><input id="cfgStart" type="date" value="${S.settings.startDate}"></div><div class="field"><label>Meta C1</label><input id="cfgGoal" type="date" value="${S.settings.goalDate}"></div></div><div class="field"><label>Link MEC Idiomas</label><input id="cfgMec" type="url" value="${esc(S.settings.mecUrl)}"></div><div class="field"><label>Link do Copilot</label><input id="cfgCopilot" type="url" value="${esc(S.settings.copilotUrl)}" placeholder="cole aqui o endereço do seu Copilot"></div><h3>Metas de tempo por passo (minutos)</h3><div class="grid2">${S.settings.stepMinutes.map((v,i)=>`<div class="field"><label>Passo ${i+1}</label><input id="cfgMin${i}" type="number" min="1" value="${v}"></div>`).join('')}</div><div class="grid2"><div class="field"><label>Tempo teste (min)</label><input id="cfgTestMin" type="number" min="1" value="${S.settings.testMinutes}"></div><div class="field"><label>Nota mínima (%)</label><input id="cfgPass" type="number" min="1" max="100" value="${S.settings.passPercent}"></div><div class="field"><label>Tempo lógica (min)</label><input id="cfgLogicMin" type="number" min="1" value="${S.settings.logicMinutes}"></div></div><h3>Bloqueios de ofensiva</h3><div class="grid2"><div class="field"><label>Quantidade atual</label><input id="cfgFreeze" type="number" min="0" value="${S.settings.freezeCount}"></div><div class="field"><label>Máximo guardado</label><input id="cfgFreezeMax" type="number" min="1" value="${S.settings.freezeMax}"></div><div class="field"><label>Dias para ganhar</label><input id="cfgFreezeEvery" type="number" min="1" value="${S.settings.freezeEvery}"></div></div>`}
function num(id,min=0){return Math.max(min,Number(document.getElementById(id).value)||min)}
function saveSettings(){S.settings.level=document.getElementById('cfgLevel').value;S.settings.module=num('cfgModule',1);S.settings.lesson=num('cfgLesson',1);S.settings.lessonsDone=num('cfgDone',0);LEVELS.forEach(l=>S.settings.totals[l]=num('cfgTotal'+l,1));S.settings.startDate=document.getElementById('cfgStart').value||S.settings.startDate;S.settings.goalDate=document.getElementById('cfgGoal').value||S.settings.goalDate;S.settings.mecUrl=document.getElementById('cfgMec').value.trim()||DEFAULT.settings.mecUrl;S.settings.copilotUrl=document.getElementById('cfgCopilot').value.trim();S.settings.stepMinutes=S.settings.stepMinutes.map((_,i)=>num('cfgMin'+i,1));S.settings.testMinutes=num('cfgTestMin',1);S.settings.logicMinutes=num('cfgLogicMin',1);S.settings.passPercent=Math.min(100,num('cfgPass',1));S.settings.freezeMax=num('cfgFreezeMax',1);S.settings.freezeCount=Math.min(S.settings.freezeMax,num('cfgFreeze',0));S.settings.freezeEvery=num('cfgFreezeEvery',1);save();renderAll();toast('Configurações salvas.')}
function copyBackup(){S.lastBackup=iso();save();copyText(JSON.stringify(S),'Backup copiado!');renderMore()}
function restoreBackup(){try{const data=JSON.parse(document.getElementById('backupBox').value);if(!data||typeof data!=='object'||!data.settings||!data.streak)throw Error();S=merge(clone(DEFAULT),data);save();renderAll();toast('Backup restaurado.')}catch(e){toast('Backup inválido.')}}
function resetAll(){if(!resetArmed){resetArmed=true;openModal(`<h2>Tem certeza?</h2><p>Esta é a primeira confirmação. Todos os dados locais serão apagados.</p><div class="stack"><button class="danger" onclick="resetAll()">Confirmar e zerar</button><button class="secondary" onclick="resetArmed=false;closeModal()">Cancelar</button></div>`);return}try{localStorage.removeItem(KEY)}catch(e){}S=clone(DEFAULT);resetArmed=false;closeModal();save();renderAll();toast('Tudo foi zerado.')}
function renderAll(){renderToday();renderFlame();renderPlan();renderTests();renderMore()}
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(btn.dataset.tab).classList.add('active');btn.classList.add('active');S.ui.tab=btn.dataset.tab;save();if(btn.dataset.tab==='teste')renderTests();if(btn.dataset.tab==='mais')renderMore();window.scrollTo(0,0)}));
function selectTab(id){document.querySelector(`.nav button[data-tab="${id}"]`)?.click()}
evaluateMissed();todayState();renderAll();selectTab(S.ui.tab||'hoje');
let observedDate=iso();setInterval(()=>{if(iso()!==observedDate){observedDate=iso();evaluateMissed();renderAll();selectTab('hoje')}},30000);
if(S.streak.notice){setTimeout(()=>{toast(S.streak.notice);S.streak.notice='';save();renderToday()},500)}
</script>
</body>
</html>
