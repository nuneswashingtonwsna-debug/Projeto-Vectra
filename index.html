<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vectra 97">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23f59e0b'/%3E%3Ctext x='50' y='66' font-size='46' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23111'%3EV97%3C/text%3E%3C/svg%3E">
<title>Vectra 97 – Gestão de Manutenção</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#f59e0b;--ok:#22c55e;--warn:#eab308;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#111827;border-bottom:2px solid var(--acc)}
header h1{margin:0;font-size:18px}header small{color:var(--mut)}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
input,select,textarea,button{font:inherit;color:var(--txt);background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
button{background:var(--acc);color:#111;border:0;font-weight:700;cursor:pointer;margin-top:8px}
button.sec{background:#334155;color:var(--txt)}button.del{background:transparent;color:var(--bad);width:auto;padding:2px 8px;margin:0;border:1px solid var(--bad)}
button.mini{width:auto;padding:2px 8px;margin:0;font-size:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{border-top:1px solid var(--line);padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item:first-child{border-top:0}
.item small{color:var(--mut);display:block}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#111}
.ok{background:var(--ok)}.yellow{background:var(--warn)}.red{background:var(--bad)}.na{background:#64748b;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mut);font-size:11px;padding:10px 2px;font-weight:600}
nav button.on{color:var(--acc);border-top:2px solid var(--acc)}
.empty{color:var(--mut);text-align:center;padding:8px}
</style>
</head>
<body>
<header><h1 id="title">🚗 Vectra 1997 2.2</h1><small>Plano de manutenção preventiva e preditiva</small></header>
<main>
  <section id="t-painel"></section>
  <section id="t-plano" hidden></section>
  <section id="t-servicos" hidden></section>
  <section id="t-combustivel" hidden></section>
  <section id="t-inspecao" hidden></section>
  <section id="t-config" hidden></section>
</main>
<nav id="nav"></nav>

<script>
(function(){
'use strict';
var KEY='vectra97_gestao_v1';
var TABS=[['painel','📊','Painel'],['plano','🛠️','Plano'],['servicos','🧾','Serviços'],['combustivel','⛽','Abastec.'],['inspecao','🔍','Inspeção'],['config','⚙️','Config']];
var DEFAULT_PLAN=[
 ['Óleo do motor + filtro de óleo',5000,6],
 ['Filtro de ar',10000,12],
 ['Filtro de combustível',20000,24],
 ['Velas e cabos de ignição',20000,24],
 ['Correia dentada + tensor/rolamentos',50000,48],
 ['Correia do alternador/acessórios',40000,36],
 ['Fluido de arrefecimento',40000,24],
 ['Fluido de freio',20000,12],
 ['Pastilhas e discos de freio (inspeção)',10000,6],
 ['Pneus: rodízio e alinhamento/balanceamento',10000,6],
 ['Suspensão e buchas (inspeção)',20000,12],
 ['Bateria e sistema de carga (teste)',0,12],
 ['Óleo do câmbio',60000,48]
];
var S=load();
var tab='painel';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function defaults(){
  return {car:'Vectra 1997 2.2',odo:0,startOdo:0,
    plan:DEFAULT_PLAN.map(function(p){return {id:uid(),name:p[0],km:p[1],months:p[2],lastKm:null,lastDate:null}}),
    logs:[],fuel:[],insp:[]};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.plan)return d}}catch(e){}
  return defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não foi possível salvar neste navegador.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nf(n,d){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function money(n){return 'R$ '+nf(n,2)}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function br(d){return d?d.split('-').reverse().join('/'):'-'}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function $(s){return document.querySelector(s)}

/* ---------- Cálculos ---------- */
function status(p){
  var km=null,days=null;
  if(p.lastKm!=null&&p.km>0)km=p.lastKm+p.km-S.odo;
  if(p.lastDate&&p.months>0){var d=new Date(p.lastDate+'T12:00:00');d.setMonth(d.getMonth()+p.months);days=Math.round((d-new Date())/864e5)}
  var lvl='na';
  if(km!==null||days!==null){
    lvl='ok';
    if((km!==null&&km<=p.km*0.15)||(days!==null&&days<=30))lvl='yellow';
    if((km!==null&&km<=0)||(days!==null&&days<=0))lvl='red';
  }
  return {km:km,days:days,lvl:lvl};
}
function lvlText(l){return {ok:'Em dia',yellow:'Atenção',red:'Vencido',na:'Sem registro'}[l]}
function remText(s){
  var a=[];
  if(s.km!==null)a.push(s.km>=0?'faltam '+nf(s.km)+' km':'vencido há '+nf(-s.km)+' km');
  if(s.days!==null)a.push(s.days>=0?'faltam '+s.days+' dias':'vencido há '+(-s.days)+' dias');
  return a.join(' · ')||'registre o último serviço';
}
function fuelStats(){
  var f=S.fuel.slice().sort(function(a,b){return a.km-b.km}),out=[],i;
  for(i=1;i<f.length;i++){
    var d=f[i].km-f[i-1].km;
    out.push({id:f[i].id,kml:f[i].liters>0&&d>0?d/f[i].liters:null});
  }
  var v=out.filter(function(o){return o.kml}).map(function(o){return o.kml});
  var avg=v.length?v.reduce(function(a,b){return a+b},0)/v.length:null;
  return {map:out.reduce(function(m,o){m[o.id]=o.kml;return m},{}),avg:avg};
}
function totals(){
  var sv=S.logs.reduce(function(a,l){return a+(l.cost||0)},0);
  var fu=S.fuel.reduce(function(a,l){return a+(l.cost||0)},0);
  var dist=S.odo-S.startOdo;
  return {sv:sv,fu:fu,all:sv+fu,perKm:dist>0?(sv+fu)/dist:null,dist:dist};
}
function lastInsp(){
  var m={};
  S.insp.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(i){m[i.comp.toLowerCase()]=i});
  return Object.keys(m).map(function(k){return m[k]});
}

/* ---------- Render ---------- */
function renderPainel(){
  var t=totals(),fs=fuelStats(),h='';
  var alerts=S.plan.map(function(p){return {p:p,s:status(p)}}).filter(function(x){return x.s.lvl==='red'||x.s.lvl==='yellow'})
    .sort(function(a,b){return (a.s.lvl==='red'?0:1)-(b.s.lvl==='red'?0:1)});
  var crit=lastInsp().filter(function(i){return i.cond>=4});
  h+='<div class="card"><h2>Hodômetro</h2><form data-f="odo"><div class="row"><input name="odo" type="number" inputmode="numeric" min="0" placeholder="km atual" value="'+(S.odo||'')+'"><button type="submit" style="margin:0;width:auto;padding:9px 16px">Atualizar</button></div></form>';
  if(!S.odo)h+='<p class="empty">Informe a quilometragem atual para calcular os vencimentos.</p>';
  h+='</div>';
  h+='<div class="card"><h2>Resumo</h2><div class="grid">'+
    '<div class="kpi"><b>'+nf(S.odo)+' km</b><span>Hodômetro</span></div>'+
    '<div class="kpi"><b>'+money(t.all)+'</b><span>Custo total</span></div>'+
    '<div class="kpi"><b>'+(t.perKm!==null?money(t.perKm):'-')+'</b><span>Custo por km rodado</span></div>'+
    '<div class="kpi"><b>'+(fs.avg?nf(fs.avg,1)+' km/L':'-')+'</b><span>Consumo médio</span></div></div></div>';
  h+='<div class="card"><h2>Alertas de manutenção</h2>';
  if(!alerts.length&&!crit.length)h+='<p class="empty">Nenhum alerta no momento.</p>';
  alerts.forEach(function(x){h+='<div class="item"><div>'+esc(x.p.name)+'<small>'+remText(x.s)+'</small></div><span class="b '+x.s.lvl+'">'+lvlText(x.s.lvl)+'</span></div>'});
  crit.forEach(function(i){h+='<div class="item"><div>'+esc(i.comp)+' (inspeção '+br(i.date)+')<small>'+esc(i.notes||'Condição crítica')+'</small></div><span class="b red">Condição '+i.cond+'/5</span></div>'});
  h+='</div>';
  $('#t-painel').innerHTML=h;
}
function renderPlano(){
  var h='<div class="card"><h2>Plano preventivo</h2><small style="color:var(--mut)">Intervalos iniciais são sugestões genéricas: confirme no manual e ajuste conforme o uso.</small>';
  S.plan.forEach(function(p){
    var s=status(p);
    h+='<div class="item"><div><b>'+esc(p.name)+'</b><small>A cada '+(p.km?nf(p.km)+' km':'—')+' / '+(p.months?p.months+' meses':'—')+'</small>'+
    '<small>Último: '+(p.lastKm!=null?nf(p.lastKm)+' km':'-')+' em '+br(p.lastDate)+'</small><small>'+remText(s)+'</small></div>'+
    '<div style="text-align:right"><span class="b '+s.lvl+'">'+lvlText(s.lvl)+'</span><br><br>'+
    '<button class="sec mini" data-act="edit" data-id="'+p.id+'">Editar</button> <button class="del" data-act="delplan" data-id="'+p.id+'">✕</button></div></div>';
  });
  h+='</div><div class="card"><h2>Novo item</h2><form data-f="plan"><label>Nome</label><input name="name" required>'+
  '<div class="row"><div><label>Intervalo (km)</label><input name="km" type="number" min="0" inputmode="numeric"></div><div><label>Intervalo (meses)</label><input name="months" type="number" min="0" inputmode="numeric"></div></div>'+
  '<button type="submit">Adicionar ao plano</button></form></div>';
  $('#t-plano').innerHTML=h;
}
function renderServicos(){
  var opts='<option value="">— outro serviço —</option>'+S.plan.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('');
  var h='<div class="card"><h2>Registrar serviço</h2><form data-f="log"><label>Item do plano</label><select name="pid">'+opts+'</select>'+
  '<label>Descrição (se outro / detalhes)</label><input name="desc">'+
  '<div class="row"><div><label>Data</label><input name="date" type="date" value="'+today()+'" required></div><div><label>Km</label><input name="km" type="number" inputmode="numeric" value="'+(S.odo||'')+'" required></div></div>'+
  '<div class="row"><div><label>Custo (R$)</label><input name="cost" type="text" inputmode="decimal" placeholder="0,00"></div><div><label>Oficina / observações</label><input name="notes"></div></div>'+
  '<button type="submit">Salvar serviço</button></form></div><div class="card"><h2>Histórico</h2>';
  if(!S.logs.length)h+='<p class="empty">Nenhum serviço registrado.</p>';
  S.logs.slice().sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(l){
    h+='<div class="item"><div><b>'+esc(l.item)+'</b><small>'+br(l.date)+' · '+nf(l.km)+' km · '+money(l.cost)+'</small>'+(l.notes?'<small>'+esc(l.notes)+'</small>':'')+'</div><button class="del" data-act="dellog" data-id="'+l.id+'">✕</button></div>';
  });
  $('#t-servicos').innerHTML=h+'</div>';
}
function renderCombustivel(){
  var fs=fuelStats();
  var h='<div class="card"><h2>Novo abastecimento</h2><small style="color:var(--mut)">Encha o tanque sempre até o mesmo ponto para o km/L ficar confiável.</small>'+
  '<form data-f="fuel"><div class="row"><div><label>Data</label><input name="date" type="date" value="'+today()+'" required></div><div><label>Km</label><input name="km" type="number" inputmode="numeric" value="'+(S.odo||'')+'" required></div></div>'+
  '<div class="row"><div><label>Litros</label><input name="liters" type="text" inputmode="decimal" required></div><div><label>Valor pago (R$)</label><input name="cost" type="text" inputmode="decimal" required></div></div>'+
  '<button type="submit">Salvar abastecimento</button></form></div><div class="card"><h2>Histórico</h2>';
  if(!S.fuel.length)h+='<p class="empty">Nenhum abastecimento registrado.</p>';
  S.fuel.slice().sort(function(a,b){return b.km-a.km}).forEach(function(f){
    var k=fs.map[f.id];
    h+='<div class="item"><div><b>'+br(f.date)+' · '+nf(f.km)+' km</b><small>'+nf(f.liters,2)+' L · '+money(f.cost)+(k?' · <b>'+nf(k,1)+' km/L</b>':'')+'</small></div><button class="del" data-act="delfuel" data-id="'+f.id+'">✕</button></div>';
  });
  $('#t-combustivel').innerHTML=h+'</div>';
}
function renderInspecao(){
  var comps=['Compressão cilindro 1','Compressão cilindro 2','Compressão cilindro 3','Compressão cilindro 4','Folga de válvulas','Espessura pastilha dianteira','Espessura pastilha traseira','Espessura disco de freio','Profundidade sulco do pneu','Tensão da bateria','Tensão do alternador (carga)','Nível de óleo (consumo)','Folga bucha/pivô','Vazamentos'];
  var h='<div class="card"><h2>Inspeção preditiva</h2><small style="color:var(--mut)">Meça, registre e acompanhe a tendência de cada componente. Condição: 1 = ótimo … 5 = crítico.</small>'+
  '<form data-f="insp"><label>Componente / ponto medido</label><input name="comp" list="dl" required><datalist id="dl">'+comps.map(function(c){return '<option value="'+c+'">'}).join('')+'</datalist>'+
  '<div class="row"><div><label>Data</label><input name="date" type="date" value="'+today()+'" required></div><div><label>Km</label><input name="km" type="number" inputmode="numeric" value="'+(S.odo||'')+'"></div></div>'+
  '<div class="row"><div><label>Medição</label><input name="value" type="text" inputmode="decimal"></div><div><label>Unidade</label><input name="unit" placeholder="mm, bar, V…"></div></div>'+
  '<label>Condição</label><select name="cond"><option value="1">1 – Ótimo</option><option value="2">2 – Bom</option><option value="3" selected>3 – Atenção</option><option value="4">4 – Ruim</option><option value="5">5 – Crítico</option></select>'+
  '<label>Observações</label><textarea name="notes" rows="2"></textarea><button type="submit">Salvar inspeção</button></form></div>';
  h+='<div class="card"><h2>Tendência por componente</h2>';
  var g={};
  S.insp.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(i){var k=i.comp.toLowerCase();(g[k]=g[k]||[]).push(i)});
  var keys=Object.keys(g);
  if(!keys.length)h+='<p class="empty">Nenhuma inspeção registrada.</p>';
  keys.forEach(function(k){
    var a=g[k],l=a[a.length-1],trend='';
    var vs=a.filter(function(x){return x.value!=null});
    if(vs.length>=2){var f=vs[0],z=vs[vs.length-1],dk=(z.km||0)-(f.km||0);
      trend='Variação: '+nf(z.value-f.value,2)+' '+esc(z.unit||'')+(dk>0?' em '+nf(dk)+' km (≈ '+nf((z.value-f.value)/dk*1000,3)+' '+esc(z.unit||'')+' / 1.000 km)':'');}
    h+='<div class="item"><div><b>'+esc(l.comp)+'</b><small>Última: '+br(l.date)+(l.value!=null?' · '+nf(l.value,2)+' '+esc(l.unit||''):'')+'</small>'+(trend?'<small>'+trend+'</small>':'')+(l.notes?'<small>'+esc(l.notes)+'</small>':'')+
    '<small>'+a.length+' registro(s)</small></div><div style="text-align:right"><span class="b '+(l.cond>=4?'red':l.cond===3?'yellow':'ok')+'">'+l.cond+'/5</span><br><br><button class="del" data-act="delinsp" data-id="'+l.id+'">✕</button></div></div>';
  });
  $('#t-inspecao').innerHTML=h+'</div>';
}
function renderConfig(){
  $('#t-config').innerHTML='<div class="card"><h2>Veículo</h2><form data-f="car"><label>Nome</label><input name="car" value="'+esc(S.car)+'"><label>Km na compra (para custo por km)</label><input name="startOdo" type="number" inputmode="numeric" value="'+S.startOdo+'"><button type="submit">Salvar</button></form></div>'+
  '<div class="card"><h2>Backup</h2><small style="color:var(--mut)">Os dados ficam só neste aparelho/navegador. Exporte de vez em quando.</small>'+
  '<button type="button" data-act="export">Exportar backup (.json)</button>'+
  '<label>Importar backup</label><input type="file" id="imp" accept="application/json,.json">'+
  '<button type="button" class="sec" data-act="reset">Apagar tudo e recomeçar</button></div>';
}
var R={painel:renderPainel,plano:renderPlano,servicos:renderServicos,combustivel:renderCombustivel,inspecao:renderInspecao,config:renderConfig};
function renderNav(){
  $('#nav').innerHTML=TABS.map(function(t){return '<button type="button" data-tab="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'<br>'+t[2]+'</button>'}).join('');
  TABS.forEach(function(t){$('#t-'+t[0]).hidden=t[0]!==tab});
}
function render(){$('#title').textContent='🚗 '+S.car;renderNav();R[tab]()}
function commit(){save();render()}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  var a=b.dataset.act,id=b.dataset.id;if(!a)return;
  if(a==='delplan'&&confirm('Remover este item do plano?')){S.plan=S.plan.filter(function(p){return p.id!==id});commit()}
  if(a==='dellog'&&confirm('Remover este serviço?')){S.logs=S.logs.filter(function(p){return p.id!==id});commit()}
  if(a==='delfuel'&&confirm('Remover este abastecimento?')){S.fuel=S.fuel.filter(function(p){return p.id!==id});commit()}
  if(a==='delinsp'&&confirm('Remover esta inspeção?')){S.insp=S.insp.filter(function(p){return p.id!==id});commit()}
  if(a==='edit'){
    var p=S.plan.filter(function(x){return x.id===id})[0];if(!p)return;
    var km=prompt('Intervalo em km (0 = não usar):',p.km);if(km===null)return;
    var mo=prompt('Intervalo em meses (0 = não usar):',p.months);if(mo===null)return;
    p.km=Math.max(0,num(km)||0);p.months=Math.max(0,num(mo)||0);commit();
  }
  if(a==='export'){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    var l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='vectra97-backup-'+today()+'.json';
    document.body.appendChild(l);l.click();l.remove();
  }
  if(a==='reset'&&confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')){S=defaults();commit()}
});
document.addEventListener('change',function(e){
  if(e.target.id!=='imp')return;
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.plan||!d.logs)throw 0;S=d;commit();alert('Backup importado.')}catch(x){alert('Arquivo de backup inválido.')}};
  r.readAsText(f);
});
document.addEventListener('submit',function(e){
  var f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();
  var v=function(n){return f.elements[n]?f.elements[n].value:''};
  if(k==='odo'){S.odo=Math.max(0,num(v('odo'))||0);if(!S.startOdo&&!S.logs.length&&!S.fuel.length)S.startOdo=S.odo}
  if(k==='car'){S.car=v('car').trim()||S.car;S.startOdo=Math.max(0,num(v('startOdo'))||0)}
  if(k==='plan'){S.plan.push({id:uid(),name:v('name').trim(),km:Math.max(0,num(v('km'))||0),months:Math.max(0,num(v('months'))||0),lastKm:null,lastDate:null})}
  if(k==='log'){
    var km=num(v('km')),date=v('date'),p=S.plan.filter(function(x){return x.id===v('pid')})[0];
    if(km===null||!date)return;
    var item=(p?p.name:'')+(p&&v('desc')?' – ':'')+v('desc').trim();
    S.logs.push({id:uid(),date:date,km:km,item:item||'Serviço',cost:num(v('cost'))||0,notes:v('notes').trim()});
    if(p){p.lastKm=km;p.lastDate=date}
    if(km>S.odo)S.odo=km;
  }
  if(k==='fuel'){
    var fk=num(v('km')),fl=num(v('liters')),fc=num(v('cost'));
    if(fk===null||!fl||fc===null)return;
    S.fuel.push({id:uid(),date:v('date'),km:fk,liters:fl,cost:fc});
    if(fk>S.odo)S.odo=fk;
  }
  if(k==='insp'){
    var ik=num(v('km'));
    S.insp.push({id:uid(),date:v('date'),km:ik,comp:v('comp').trim(),value:num(v('value')),unit:v('unit').trim(),cond:parseInt(v('cond'),10),notes:v('notes').trim()});
    if(ik!==null&&ik>S.odo)S.odo=ik;
  }
  commit();
});

render();
})();
</script>
</body>
</html>
