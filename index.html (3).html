      const body=`<details open><summary>Configurações principais</summary><div class="details-body"><form id="settingsForm"><div class="form-grid">${moneyInput("ownHourValue","Valor da própria hora",state.settings.ownHourValue)}${moneyInput("garageMonthly","Garagem mensal",state.settings.garageMonthly)}${moneyInput("maxInstallment","Parcela máxima",state.settings.maxInstallment)}${moneyInput("maxMonthlySpend","Máximo disponível por mês",state.settings.maxMonthlySpend)}<div class="field"><label>Uso mensal mínimo (km)</label><input type="number" min="0" name="monthlyKmMin" value="${state.settings.monthlyKmMin}"></div><div class="field"><label>Uso mensal máximo (km)</label><input type="number" min="0" name="monthlyKmMax" value="${state.settings.monthlyKmMax}"></div><div class="field"><label>Raio de busca (km)</label><input type="number" min="0" name="searchRadiusKm" value="${state.settings.searchRadiusKm}"></div><div class="field"><label>Horizonte do projeto (anos)</label><input type="number" min="1" name="projectYears" value="${state.settings.projectYears}"></div><div class="field"><label>Óleo — intervalo km</label><input type="number" min="0" name="oilKm" value="${state.settings.oilKm}"></div><div class="field"><label>Óleo — intervalo meses</label><input type="number" min="0" name="oilMonths" value="${state.settings.oilMonths}"></div><div class="field"><label>Alerta autonomia (%)</label><input type="number" min="0" name="autonomyAlertPercent" value="${state.settings.autonomyAlertPercent}"></div><div class="field"><label>FMEA: limite baixo</label><input type="number" min="1" name="fmeaLowMax" value="${state.settings.fmeaLowMax}"></div><div class="field"><label>FMEA: limite médio</label><input type="number" min="1" name="fmeaMediumMax" value="${state.settings.fmeaMediumMax}"></div>${checkbox("includeReusableTools","Incluir ferramentas reutilizáveis no custo total/km",state.settings.includeReusableTools)}</div><button type="button" class="btn primary block" id="saveSettingsBtn">SALVAR CONFIGURAÇÕES</button></form></div></details>
      <details open><summary>Armazenamento e backup</summary><div class="details-body"><div class="grid two"><div class="card metric"><span class="label">Uso local estimado</span><span class="value">${storage.label}</span><span class="sub">Estimativa do JSON; o navegador pode contabilizar diferente</span></div><div class="card"><p>Anúncios: <strong>${state.candidates.length}</strong><br>Imagens: <strong>${storage.images}</strong><br>Registros: <strong>${state.records.length}</strong><br>Peças: <strong>${state.parts.length}</strong></p></div></div>${storage.bytes>30*1048576?`<p class="danger-text"><strong>Uso elevado.</strong> Considere excluir imagens/anúncios antigos após exportar backup.</p>`:""}<p>Último backup: <strong>${state.meta.lastBackup?dateLabel(state.meta.lastBackup):"Nunca"}</strong></p><div class="button-row"><button class="btn success" id="exportBackupBtn">EXPORTAR BACKUP</button><label class="btn" style="display:flex;align-items:center;justify-content:center">IMPORTAR BACKUP<input class="hidden" type="file" accept="application/json,.json" id="importBackupInput"></label></div></div></details>
      <details><summary>Relatórios e histórico</summary><div class="details-body"><button class="btn block" data-action="open-reports">RELATÓRIOS IMPRIMÍVEIS</button><h3 class="section">Log de decisões</h3>${state.decisions.length?`<div class="list">${state.decisions.slice(0,30).map(d=>`<div class="list-item"><strong>${escapeHtml(d.decision)}</strong><br><small>${dateLabel(d.date)} · ${escapeHtml(d.context)}</small><p>${escapeHtml(d.justification||"Sem justificativa adicional")}</p><small>${escapeHtml(d.values||"")}</small></div>`).join("")}</div>`:"<p class='muted'>Nenhuma decisão importante registrada.</p>"}</div></details>
      <details><summary>Limitações da versão local</summary><div class="details-body"><ul><li>Não consulta FIPE, anúncios, preços, seguradoras ou documentos na internet.</li><li>Links são armazenados, mas não são lidos pelo navegador por restrições de segurança e ausência de backend.</li><li>Alertas existem somente dentro da aplicação; não há integração com calendário/notificações externas.</li><li>Impressão/PDF usa o recurso nativo do navegador.</li><li>Os dados pertencem ao perfil deste navegador/dispositivo. Faça backup periódico.</li></ul></div></details>
      <details><summary>Dados e reinicialização</summary><div class="details-body"><button class="btn danger block" id="resetAppBtn">APAGAR TODOS OS DADOS LOCAIS</button></div></details>`;
      openModal(initial?"Configurações iniciais":"Configurações e dados",body,`<button class="btn" data-action="close-modal">FECHAR</button>`,{wide:true});
      byId("saveSettingsBtn").onclick=()=>{const data=getFormData(byId("settingsForm"));["ownHourValue","garageMonthly","maxInstallment","maxMonthlySpend","monthlyKmMin","monthlyKmMax","searchRadiusKm","projectYears","oilKm","oilMonths","autonomyAlertPercent","fmeaLowMax","fmeaMediumMax"].forEach(k=>data[k]=nonNegative(data[k]));state.settings={...state.settings,...data};scheduleSave();toast("Configurações salvas.","success");if(initial){state.meta.firstUseComplete=true;scheduleSave();closeModal();byId("intro").classList.add("hidden");render();}else openSettings(false);};
      byId("exportBackupBtn").onclick=exportBackup;
      byId("importBackupInput").onchange=event=>importBackup(event.target.files[0]);
      byId("resetAppBtn").onclick=async()=>{if(!confirmAction("APAGAR todos os dados locais? Exporte um backup antes. Esta ação não pode ser desfeita."))return;if(!confirmAction("Confirma a reinicialização completa?"))return;state=createDefaultState();await persistState(false);closeModal();byId("intro").classList.remove("hidden");navigate("home");};
    }

    async function exportBackup() {
      const payload={application:"PROJETO VECTRA B",version:APP_VERSION,exportedAt:new Date().toISOString(),data:state};const text=JSON.stringify(payload,null,2);downloadBlob(new Blob([text],{type:"application/json"}),`projeto-vectra-b-backup-${localDateISO()}.json`);state.meta.lastBackup=new Date().toISOString();state.meta.importantChange=false;state.backupsMetadata.unshift({id:uid(),date:state.meta.lastBackup,size:new Blob([text]).size,version:APP_VERSION});await persistState();toast("Backup exportado em um único arquivo JSON.","success");openSettings();
    }

    function importBackup(file) {
      if(!file)return;if(!confirmAction("A restauração substituirá TODOS os dados atuais. Continuar?"))return;const reader=new FileReader();reader.onerror=()=>toast("Não foi possível ler o arquivo.","error");reader.onload=async()=>{try{const parsed=JSON.parse(reader.result);if(parsed.application!=="PROJETO VECTRA B"||!parsed.data||typeof parsed.data!=="object")throw new Error("Formato incompatível");if(!Array.isArray(parsed.data.candidates)||!parsed.data.settings)throw new Error("Estrutura incompleta");state=parsed.data;migrateState();state.meta.updatedAt=new Date().toISOString();await persistState(false);closeModal();render();toast("Backup restaurado com sucesso.","success");}catch(error){console.error(error);toast(`Backup inválido: ${error.message}`,"error");}};reader.readAsText(file);
    }

    // ===========================
    // REPORT
    // ===========================
    function openReports() {
      openModal("Relatórios imprimíveis",`<p>O relatório abre em uma janela limpa. Use “Imprimir / Salvar PDF” no navegador.</p><div class="grid two"><button class="btn" data-report="acquisition-summary">AQUISIÇÃO — RESUMO</button><button class="btn" data-report="acquisition-full">AQUISIÇÃO — COMPLETO</button><button class="btn" data-report="reform">REFORMA</button><button class="btn" data-report="costs">CUSTOS</button><button class="btn" data-report="reliability">CONFIABILIDADE</button><button class="btn" data-report="fmea">FMEA</button><button class="btn" data-report="inventory">ESTOQUE</button></div>`,`<button class="btn" data-action="close-modal">FECHAR</button>`);
      document.querySelectorAll("[data-report]").forEach(btn=>btn.onclick=()=>printReport(btn.dataset.report));
    }

    function reportTable(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;}
    function reportSection(title,content){return `<section><h2>${escapeHtml(title)}</h2>${content}</section>`;}
    function printReport(type) {
      let title="Relatório";let content="";
      if(type.startsWith("acquisition")){title=type.endsWith("summary")?"Relatório de Aquisição — Resumo":"Relatório de Aquisição — Completo";const candidates=state.vehicle?[state.vehicle]:state.candidates;content=reportSection("Candidatos",reportTable(["Veículo","Preço","Custo total","Nota","Documento","Decisão"],candidates.map(c=>[escapeHtml(candidateName(c)),money(c.askingPrice),money(calculateAcquisitionCost(c).total),calculateInspection(c.candidateId||c.id).verified?number(calculateInspection(c.candidateId||c.id).score,2):"Não avaliada",documentStatus(c),recommendation(c)])));if(state.vehicle){const v=state.vehicle;content+=reportSection("Compra",`<p><strong>Valor final:</strong> ${money(v.finalPrice)}<br><strong>Forma:</strong> ${escapeHtml(v.paymentMethod||"Não informada")}<br><strong>Transporte:</strong> ${money(v.transportCost)}<br><strong>Documentação:</strong> ${money(nonNegative(v.documentCost)+nonNegative(v.transferCost)+nonNegative(v.debts))}<br><strong>Seguro inicial:</strong> ${money(v.initialInsurance)}<br><strong>Custo total:</strong> ${money(v.acquisitionTotal)}<br><strong>Reserva atual:</strong> ${money(state.finance.currentReserve)}<br><strong>Motivos:</strong> ${escapeHtml(v.reason||"Não informado")}</p>`);}if(type.endsWith("full")){content+=reportSection("Reparos considerados",reportTable(["Título","Prioridade","Prazo","Previsto"],state.repairs.map(r=>[escapeHtml(r.title),r.priority,r.timing,money(calculateRepairExpected(r))])));content+=reportSection("Decisões",state.decisions.map(d=>`<p><strong>${escapeHtml(d.decision)}</strong> — ${dateLabel(d.date)}<br>${escapeHtml(d.justification||"")} ${escapeHtml(d.values||"")}</p>`).join("")||"<p>Nenhuma.</p>");}}
      if(type==="reform"){title="Relatório de Reforma";content=reportSection("Reparos",reportTable(["Reparo","Prioridade","Status","Previsto","Real","Horas"],state.repairs.filter(r=>!r.candidateId).map(r=>[escapeHtml(r.title),r.priority,r.status,money(calculateRepairExpected(r)),money(r.actualCost),number(r.actualHours||r.ownHours,1)])));}
      if(type==="costs"){title="Relatório de Custos";const c=calculateProjectCosts();content=reportSection("Indicadores",`<p><strong>Km contabilizados:</strong> ${number(c.km,0)}<br><strong>Custo operacional:</strong> ${money(c.operational)}<br><strong>Custo operacional/km:</strong> ${c.operationalPerKm===null?"Não calculável":money(c.operationalPerKm)}<br><strong>Aquisição:</strong> ${money(c.acquisition)}<br><strong>Ferramentas:</strong> ${money(c.tools)}<br><strong>Custo total/km:</strong> ${c.totalPerKm===null?"Não calculável":money(c.totalPerKm)}</p>`)+reportSection("Despesas e serviços",reportTable(["Data","Tipo","Descrição","Custo"],state.records.filter(r=>nonNegative(r.cost)||nonNegative(r.total)).map(r=>[dateLabel(r.date),r.type,escapeHtml(r.title||""),money(nonNegative(r.cost)||nonNegative(r.total))])));}
      if(type==="reliability"){title="Relatório de Confiabilidade";content=reportSection("Falhas, quase-falhas e sintomas",reportTable(["Data","Tipo","Ocorrência","Status","Causa raiz","Solução"],state.failures.map(f=>[dateLabel(f.date),f.type,escapeHtml(f.title),f.status,escapeHtml(f.rootCause||"Em análise"),escapeHtml(f.solution||"Não informada")])));}
      if(type==="fmea"){title="Relatório FMEA";content=reportSection("FMEA",reportTable(["Modo de falha","G","O","D","NPR","Prioridade","Ação"],state.fmea.map(f=>{const x=calculateFmea(f);return[escapeHtml(f.title),x.severity,x.occurrence,x.detection,x.npr,x.band,escapeHtml(f.action||"Não informada")];})));}
      if(type==="inventory"){title="Relatório de Estoque";content=reportSection("Peças",reportTable(["Peça","Código","Qtd.","Mín.","Status","Disponibilidade","Local","Prioridade"],state.parts.map(p=>[escapeHtml(p.name),escapeHtml(p.code||"—"),p.quantity,p.minimum,p.status,p.availability,escapeHtml(p.location||"—"),partPriority(p)])));}
      const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>body{font:12px/1.45 Arial,sans-serif;color:#111;margin:24px}h1{border-bottom:3px solid #1678b8;padding-bottom:8px}h2{margin-top:24px;border-bottom:1px solid #aaa}table{width:100%;border-collapse:collapse}th,td{padding:6px;border:1px solid #bbb;text-align:left;vertical-align:top}th{background:#e7f0f5}.meta{color:#555}.actions{position:sticky;top:0;background:white;padding:8px 0}@media print{.actions{display:none}body{margin:0}@page{size:A4;margin:12mm}}</style></head><body><div class="actions"><button onclick="window.print()">IMPRIMIR / SALVAR PDF</button></div><h1>${escapeHtml(title)}</h1><p class="meta">PROJETO VECTRA B — Engenharia de Confiabilidade<br>Gerado em ${new Date().toLocaleString("pt-BR")}</p>${content||"<p>Não há dados para este relatório.</p>"}</body></html>`;
      const win=window.open("","_blank");if(!win){toast("Permita pop-ups para abrir o relatório.","error");return;}win.document.open();win.document.write(html);win.document.close();
    }

    // ===========================
    // INITIALIZATION
    // ===========================
    async function init() {
      await loadState();
      byId("alertsBtn").addEventListener("click",openAlerts);
      byId("settingsBtn").addEventListener("click",()=>openSettings(false));
      byId("startBtn").addEventListener("click",()=>{state.meta.firstUseComplete=true;scheduleSave();byId("intro").classList.add("hidden");render();});
      byId("initialSettingsBtn").addEventListener("click",()=>openSettings(true));
      if(!state.meta.firstUseComplete)byId("intro").classList.remove("hidden");
      render();
    }

    init().catch(error=>{console.error(error);byId("app").innerHTML=`<div class="empty"><strong>Falha ao iniciar</strong><span>Não foi possível abrir os dados locais. Verifique as permissões do navegador.</span></div>`;});
  })();
  </script>
</body>
</html>
