<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <meta name="color-scheme" content="dark">
  <title>PROJETO VECTRA B — Engenharia de Confiabilidade</title>
  <style>
    /* ================================================================
       PROJETO VECTRA B — INTERFACE TÉCNICA / INDUSTRIAL
       Mobile-first, sem dependências externas
       ================================================================ */
    :root {
      --bg: #071018;
      --surface: #0d1822;
      --surface-2: #132331;
      --surface-3: #192d3d;
      --line: #29465a;
      --line-soft: #1c3343;
      --text: #e7f1f7;
      --muted: #91a7b5;
      --blue: #29a8ff;
      --blue-2: #1279bc;
      --green: #35d07f;
      --yellow: #f2bf43;
      --red: #ff6370;
      --orange: #ff9248;
      --shadow: 0 12px 30px rgba(0, 0, 0, .28);
      --radius: 14px;
      --nav-h: 70px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 300px;
      min-height: 100vh;
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 90% -10%, rgba(41,168,255,.11), transparent 30%),
        linear-gradient(180deg, #061018 0%, var(--bg) 100%);
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    }

    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }
    a { color: var(--blue); overflow-wrap: anywhere; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: 1.35rem; letter-spacing: .04em; }
    h2 { font-size: 1.2rem; }
    h3 { font-size: 1rem; }
    small, .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .nowrap { white-space: nowrap; }
    .hidden { display: none !important; }
    .danger-text { color: var(--red); }
    .good-text { color: var(--green); }
    .warning-text { color: var(--yellow); }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 58px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(7, 16, 24, .94);
      backdrop-filter: blur(12px);
    }

    .brand { min-width: 0; }
    .brand strong {
      display: block;
      font-size: .95rem;
      letter-spacing: .08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand span { display: block; font-size: .7rem; color: var(--blue); text-transform: uppercase; }
    .header-actions { display: flex; gap: 6px; }

    .icon-btn, .btn {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface-2);
      cursor: pointer;
      transition: border-color .15s, transform .15s, background .15s;
    }
    .icon-btn { min-width: 44px; padding: 8px; font-size: 1.05rem; }
    .btn { padding: 10px 14px; font-weight: 700; }
    .btn:active, .icon-btn:active { transform: translateY(1px); }
    .btn:hover, .icon-btn:hover { border-color: var(--blue); }
    .btn.primary { background: var(--blue-2); border-color: var(--blue); }
    .btn.success { background: #157447; border-color: var(--green); }
    .btn.danger { background: #722a34; border-color: var(--red); }
    .btn.warning { background: #674f18; border-color: var(--yellow); }
    .btn.ghost { background: transparent; }
    .btn.small { min-height: 38px; padding: 7px 10px; font-size: .82rem; }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .button-row > .btn { flex: 1 1 130px; }

    main {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 14px 12px 26px;
    }

    .page-title { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 12px; }
    .page-title h1 { margin-bottom: 2px; }
    .eyebrow { color: var(--blue); text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 800; }

    .grid { display: grid; gap: 10px; }
    .grid.two, .grid.three, .grid.four { grid-template-columns: 1fr; }
    .card {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(19,35,49,.94), rgba(12,24,34,.97));
      box-shadow: 0 5px 16px rgba(0,0,0,.16);
      padding: 14px;
      min-width: 0;
    }
    .card.flat { box-shadow: none; }
    .card.accent { border-left: 4px solid var(--blue); }
    .card.critical { border-left: 4px solid var(--red); }
    .card.attention { border-left: 4px solid var(--yellow); }
    .card.good { border-left: 4px solid var(--green); }
    .card h2, .card h3 { margin-bottom: 8px; }
    .metric .label { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; }
    .metric .value { display: block; margin: 4px 0 2px; font-size: 1.4rem; font-weight: 850; color: var(--text); }
    .metric .sub { color: var(--muted); font-size: .75rem; }
    .section { margin-top: 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 9px; }
    .section-head h2 { margin: 0; }

    .chip, .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      background: rgba(7,16,24,.55);
      font-size: .7rem;
      font-weight: 750;
      vertical-align: middle;
    }
    .badge.green { color: var(--green); border-color: rgba(53,208,127,.5); }
    .badge.yellow { color: var(--yellow); border-color: rgba(242,191,67,.5); }
    .badge.red { color: var(--red); border-color: rgba(255,99,112,.55); }
    .badge.blue { color: var(--blue); border-color: rgba(41,168,255,.5); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }

    .field { margin-bottom: 11px; }
    label { display: block; margin: 0 0 5px; color: #bed0dc; font-size: .79rem; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      padding: 10px 11px;
      color: var(--text);
      background: #09141d;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(41,168,255,.12); }
    textarea { min-height: 86px; resize: vertical; }
    input[type="checkbox"], input[type="radio"] { width: 20px; min-height: 20px; accent-color: var(--blue); }
    input[type="range"] { padding: 0; }
    .checkline { display: flex; align-items: flex-start; gap: 9px; min-height: 34px; }
    .checkline label { margin: 1px 0 0; font-weight: 500; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 0 10px; }
    .help { margin-top: 4px; color: var(--muted); font-size: .7rem; }
    .required::after { content: " *"; color: var(--red); }
    .invalid { border-color: var(--red) !important; }

    details {
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: rgba(8,19,28,.55);
      margin-bottom: 9px;
      overflow: hidden;
    }
    summary {
      min-height: 46px;
      display: flex;
      align-items: center;
      cursor: pointer;
      padding: 11px 12px;
      color: #d9e8f1;
      font-weight: 800;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; margin-left: auto; color: var(--blue); }
    details[open] summary::after { content: "−"; }
    .details-body { padding: 0 12px 12px; }

    .list { display: grid; gap: 8px; }
    .list-item { border: 1px solid var(--line-soft); border-radius: 11px; padding: 11px; background: rgba(7,16,24,.55); }
    .list-item-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .list-item h3 { margin: 0 0 3px; overflow-wrap: anywhere; }
    .list-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .list-actions .btn { flex: 1 1 90px; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 24px 15px;
      text-align: center;
      color: var(--muted);
      background: rgba(13,24,34,.45);
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }

    .progress { height: 9px; overflow: hidden; border-radius: 999px; background: #050c12; border: 1px solid var(--line-soft); }
    .progress > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue-2), var(--blue)); }
    .progress.green > span { background: var(--green); }
    .progress.yellow > span { background: var(--yellow); }
    .progress.red > span { background: var(--red); }

    .timeline { display: grid; gap: 0; }
    .timeline-item { display: grid; grid-template-columns: 20px 1fr; gap: 8px; min-height: 54px; }
    .timeline-dot { position: relative; width: 12px; height: 12px; margin-top: 4px; border: 3px solid var(--blue); border-radius: 50%; background: var(--bg); }
    .timeline-dot::after { content: ""; position: absolute; left: 2px; top: 11px; width: 2px; height: 40px; background: var(--line); }
    .timeline-item:last-child .timeline-dot::after { display: none; }

    .score { font-size: 1.5rem; font-weight: 900; color: var(--blue); }
    .alert-item { border-left: 4px solid var(--muted); }
    .alert-item[data-level="CRÍTICO"] { border-left-color: var(--red); }
    .alert-item[data-level="ALTO"] { border-left-color: var(--orange); }
    .alert-item[data-level="MÉDIO"] { border-left-color: var(--yellow); }
    .alert-item[data-level="BAIXO"] { border-left-color: var(--blue); }
    .alert-item[data-level="INFORMATIVO"] { border-left-color: var(--green); }

    .bottom-nav {
      position: fixed;
      z-index: 50;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding: 5px 4px env(safe-area-inset-bottom);
      border-top: 1px solid var(--line);
      background: rgba(7, 16, 24, .97);
      backdrop-filter: blur(14px);
    }
    .nav-btn {
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      min-width: 0;
      padding: 6px 2px;
      cursor: pointer;
    }
    .nav-btn .nav-icon { display: block; font-size: 1.18rem; line-height: 1.05; }
    .nav-btn .nav-label { display: block; font-size: .58rem; font-weight: 750; margin-top: 4px; white-space: nowrap; }
    .nav-btn.active { color: var(--blue); background: rgba(41,168,255,.1); }

    .modal-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      background: rgba(0, 0, 0, .72);
    }
    .modal {
      display: flex;
      flex-direction: column;
      width: min(100%, 760px);
      max-height: 94vh;
      border: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
    .modal-head h2 { margin: 0; font-size: 1.05rem; }
    .modal-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px; }
    .modal-foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line-soft); }
    .modal-foot .btn { flex: 1 1 120px; }

    .intro {
      position: fixed;
      z-index: 200;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 10%, rgba(41,168,255,.2), transparent 42%),
        #061018;
    }
    .intro-card { width: min(100%, 520px); text-align: center; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); padding: 26px 18px; box-shadow: var(--shadow); }
    .intro-mark { width: 72px; height: 72px; margin: 0 auto 18px; display: grid; place-items: center; border: 2px solid var(--blue); border-radius: 18px; color: var(--blue); font: 900 1.4rem/1 ui-monospace, monospace; box-shadow: 0 0 30px rgba(41,168,255,.18); }

    .toast {
      position: fixed;
      z-index: 300;
      left: 50%;
      bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 520px);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
      background: #132331;
      box-shadow: var(--shadow);
      text-align: center;
      font-weight: 700;
    }

    .image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .image-tile { position: relative; aspect-ratio: 4/3; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #050c12; }
    .image-tile img { width: 100%; height: 100%; object-fit: cover; }
    .image-tile button { position: absolute; top: 5px; right: 5px; min-width: 34px; min-height: 34px; border: 0; border-radius: 50%; color: white; background: rgba(100,0,10,.85); }

    .compare-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .comparison-value { font-size: .86rem; border-top: 1px solid var(--line-soft); padding: 7px 0; }
    .comparison-value strong { display: block; color: var(--muted); font-size: .68rem; text-transform: uppercase; }

    .inspection-item { border: 1px solid var(--line-soft); border-radius: 10px; padding: 11px; margin-bottom: 8px; }
    .inspection-item.unverified { border-color: var(--yellow); background: rgba(242,191,67,.05); }
    .score-buttons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 8px 0; }
    .score-buttons button { min-height: 40px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: #09141d; }
    .score-buttons button.selected { border-color: var(--blue); background: var(--blue-2); }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line-soft); }
    th { color: var(--muted); text-transform: uppercase; font-size: .68rem; }

    .storage-meter { margin-top: 8px; }
    .autosave { position: fixed; right: 10px; bottom: calc(var(--nav-h) + 10px); z-index: 48; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--green); background: var(--surface); font-size: .68rem; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .autosave.show { opacity: 1; }

    @media (min-width: 560px) {
      main { padding-inline: 18px; }
      .form-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid .wide { grid-column: 1 / -1; }
      .grid.two { grid-template-columns: repeat(2, 1fr); }
      .grid.three { grid-template-columns: repeat(3, 1fr); }
      .grid.four { grid-template-columns: repeat(2, 1fr); }
      .compare-grid { grid-template-columns: repeat(2, 1fr); }
      .image-grid { grid-template-columns: repeat(3, 1fr); }
      .modal-backdrop { align-items: center; padding: 14px; }
      .modal { border-radius: 18px; }
    }

    @media (min-width: 900px) {
      .grid.four { grid-template-columns: repeat(4, 1fr); }
      .compare-grid { grid-template-columns: repeat(3, 1fr); }
      .bottom-nav { left: 50%; right: auto; width: min(650px, 100%); transform: translateX(-50%); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; }
    }

    @media print {
      :root { color-scheme: light; }
      body { color: #111; background: #fff; padding: 0; font-size: 11pt; }
      .app-header, .bottom-nav, .no-print, .toast, .autosave { display: none !important; }
      main { width: 100%; max-width: none; padding: 0; }
      .card, details { color: #111; background: #fff; box-shadow: none; border: 1px solid #aaa; break-inside: avoid; }
      .muted, small { color: #444 !important; }
      .badge, .chip { color: #111; border-color: #777; }
      details > * { display: block !important; }
      a { color: #111; text-decoration: none; }
      @page { size: A4; margin: 12mm; }
    }
  </style>
</head>
<body>
  <header class="app-header no-print">
    <div class="brand">
      <strong>PROJETO VECTRA B</strong>
      <span id="phaseLabel">Engenharia de Confiabilidade</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="alertsBtn" title="Central de alertas" aria-label="Central de alertas">⚠</button>
      <button class="icon-btn" id="settingsBtn" title="Configurações e dados" aria-label="Configurações e dados">⚙</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="bottom-nav no-print" aria-label="Navegação principal">
    <button class="nav-btn active" data-route="home"><span class="nav-icon">⌂</span><span class="nav-label">INÍCIO</span></button>
    <button class="nav-btn" data-route="acquisition"><span class="nav-icon">⌕</span><span class="nav-label">AQUISIÇÃO</span></button>
    <button class="nav-btn" data-route="repairs"><span class="nav-icon">⚒</span><span class="nav-label">REFORMA</span></button>
    <button class="nav-btn" data-route="records"><span class="nav-icon">▤</span><span class="nav-label">REGISTROS</span></button>
    <button class="nav-btn" data-route="parts"><span class="nav-icon">▣</span><span class="nav-label">ESTOQUE</span></button>
  </nav>

  <div class="autosave no-print" id="autosave">Salvo</div>
  <div class="toast hidden no-print" id="toast" role="status"></div>
  <div id="modalRoot"></div>

  <section class="intro hidden" id="intro">
    <div class="intro-card">
      <div class="intro-mark">VB</div>
      <div class="eyebrow">Engenharia de Confiabilidade</div>
      <h1>Projeto Vectra B</h1>
      <p>Objetivo: adquirir, recuperar e manter um Vectra B confiável por aproximadamente 20 anos.</p>
      <div class="button-row">
        <button class="btn primary" id="startBtn">COMEÇAR</button>
        <button class="btn" id="initialSettingsBtn">CONFIGURAÇÕES INICIAIS</button>
      </div>
    </div>
  </section>

  <script>
  (() => {
    "use strict";

    // ===========================
    // STATE
    // ===========================
    const APP_VERSION = "1.0.0";
    const DB_NAME = "ProjetoVectraBDB";
    const STORE_NAME = "app";
    const STATE_KEY = "state";

    const INSPECTION_DEFINITION = [
      { id: "motor", label: "Motor", weight: 0.30, items: ["Partida fria", "Ruídos", "Fumaça", "Vazamentos", "Temperatura / arrefecimento", "Desempenho"] },
      { id: "structure", label: "Estrutura / carroceria", weight: 0.25, items: ["Longarinas e pontos estruturais", "Corrosão", "Alinhamento da carroceria", "Assoalho e caixas de roda", "Sinais de reparo estrutural"] },
      { id: "transmission", label: "Câmbio / embreagem", weight: 0.20, items: ["Engates", "Ruídos do câmbio", "Patinação da embreagem", "Curso do pedal", "Vazamentos"] },
      { id: "electrical", label: "Elétrica", weight: 0.10, items: ["Bateria e carga", "Painel e luzes", "Vidros e travas", "Chicotes e adaptações", "Códigos OBD2"] },
      { id: "suspension", label: "Suspensão / direção / freios", weight: 0.10, items: ["Suspensão", "Direção", "Freios", "Pneus — estado geral", "Teste de rodagem"] },
      { id: "finish", label: "Acabamento / interior", weight: 0.05, items: ["Bancos e forrações", "Painel", "Vedação", "Pintura / estética", "Comandos internos"] },
      { id: "ac", label: "Ar-condicionado", weight: 0, items: ["Funcionamento", "Ruídos", "Vazamentos aparentes"] }
    ];

    const PRIORITY_ORDER = { "SEGURANÇA": 1, "CONFIABILIDADE": 2, "CONFORTO": 3, "ESTÉTICA": 4 };
    const ALERT_ORDER = { "CRÍTICO": 1, "ALTO": 2, "MÉDIO": 3, "BAIXO": 4, "INFORMATIVO": 5 };

    let state = null;
    let db = null;
    let saveTimer = null;
    let toastTimer = null;
    let currentRoute = "home";
    let currentRecordFilter = "TODOS";

    function dateForMonthOffset(offset) {
      const date = new Date();
      date.setDate(1);
      date.setMonth(date.getMonth() + offset);
      return localDateISO(date);
    }

    function createDefaultState() {
      const createdAt = new Date().toISOString();
      return {
        meta: { version: APP_VERSION, createdAt, updatedAt: createdAt, firstUseComplete: false, lastBackup: "", importantChange: false },
        settings: {
          phase: "AQUISIÇÃO",
          ownHourValue: 40,
          garageMonthly: 100,
          maxInstallment: 1000,
          monthlyKmMin: 650,
          monthlyKmMax: 850,
          oilKm: 5000,
          oilMonths: 6,
          autonomyAlertPercent: 15,
          searchRadiusKm: 100,
          projectYears: 20,
          defaultFuel: "Gasolina",
          fmeaLowMax: 100,
          fmeaMediumMax: 300,
          includeReusableTools: false,
          maxMonthlySpend: 0
        },
        finance: { currentReserve: 5000, acquisitionExpenses: 0, ignoredAlerts: [], loanSimulation: null },
        contributions: [
          { id: uid(), date: dateForMonthOffset(1), status: "GARANTIDO", min: 2000, max: 2000, description: "Aporte garantido (configuração inicial)" },
          { id: uid(), date: dateForMonthOffset(2), status: "PROVÁVEL", min: 2000, max: 3000, description: "Aporte provável (configuração inicial)" },
          { id: uid(), date: dateForMonthOffset(5), status: "PROVÁVEL", min: 3000, max: 3000, description: "Aporte provável (configuração inicial)" }
        ],
        candidates: [], inspections: [], vehicle: null, repairs: [], records: [], failures: [], fmea: [], parts: [], partQuotes: [],
        tools: [], services: [], fuelLogs: [], documents: [], insuranceQuotes: [], modifications: [], decisions: [], patrimonialHistory: [],
        oilLogs: [], fluids: [], beltLogs: [], alerts: [], backupsMetadata: []
      };
    }

    // ===========================
    // STORAGE
    // ===========================
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = event => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) database.createObjectStore(STORE_NAME, { keyPath: "id" });
        };
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onerror = () => reject(request.error);
      });
    }

    function idbGet(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(id);
        request.onsuccess = () => resolve(request.result ? request.result.value : null);
        request.onerror = () => reject(request.error);
      });
    }

    function idbSet(id, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put({ id, value });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadState() {
      try {
        await openDatabase();
        state = await idbGet(STATE_KEY);
      } catch (error) {
        console.warn("IndexedDB indisponível; usando localStorage como contingência.", error);
        try { state = JSON.parse(localStorage.getItem("vectraBState")); } catch (_) { state = null; }
      }
      if (!state) state = createDefaultState();
      migrateState();
    }

    function migrateState() {
      const defaults = createDefaultState();
      state.meta = { ...defaults.meta, ...(state.meta || {}), version: APP_VERSION };
      state.settings = { ...defaults.settings, ...(state.settings || {}) };
      state.finance = { ...defaults.finance, ...(state.finance || {}) };
      ["contributions", "candidates", "inspections", "repairs", "records", "failures", "fmea", "parts", "partQuotes", "tools", "services", "fuelLogs", "documents", "insuranceQuotes", "modifications", "decisions", "patrimonialHistory", "oilLogs", "fluids", "beltLogs", "alerts", "backupsMetadata"].forEach(key => {
        if (!Array.isArray(state[key])) state[key] = [];
      });
      if (state.vehicle === undefined) state.vehicle = null;
    }

    async function persistState(showIndicator = true) {
      state.meta.updatedAt = new Date().toISOString();
      try {
        if (db) await idbSet(STATE_KEY, state);
        else localStorage.setItem("vectraBState", JSON.stringify(state));
        if (showIndicator) showSaved();
      } catch (error) {
        console.error(error);
        toast("Não foi possível salvar. Exporte um backup e verifique o espaço do navegador.", "error");
      }
    }

    function scheduleSave(important = false) {
      if (important) state.meta.importantChange = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => persistState(), 350);
    }

    // ===========================
    // CALCULATIONS
    // ===========================
    function safeNumber(value, fallback = 0) {
      const number = typeof value === "string" ? Number(value.replace(",", ".")) : Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function nonNegative(value) { return Math.max(0, safeNumber(value)); }

    function candidateRepairs(candidateId, timing = null) {
      return state.repairs.filter(item => item.candidateId === candidateId && (!timing || item.timing === timing));
    }

    function calculateRepairExpected(repair) {
      const explicit = nonNegative(repair.estimatedCost);
      const components = nonNegative(repair.partsCost) + nonNegative(repair.materialsCost) + nonNegative(repair.thirdPartyCost) + nonNegative(repair.toolCost);
      return explicit || components;
    }

    function calculateRepairEconomic(repair) {
      return calculateRepairExpected(repair) + nonNegative(repair.ownHours) * nonNegative(state.settings.ownHourValue);
    }

    function calculateInspection(candidateId) {
      const inspection = state.inspections.find(item => item.candidateId === candidateId);
      if (!inspection) return { score: 0, verified: 0, total: inspectionItemCount(), unverified: inspectionItemCount(), categories: {} };
      let weightedSum = 0;
      let activeWeight = 0;
      let verified = 0;
      const categories = {};
      INSPECTION_DEFINITION.forEach(category => {
        const scored = category.items.map((_, index) => inspection.items[`${category.id}-${index}`]).filter(item => item && item.verified && Number.isFinite(Number(item.score)));
        const average = scored.length ? scored.reduce((sum, item) => sum + safeNumber(item.score), 0) / scored.length : 0;
        categories[category.id] = { average, verified: scored.length, total: category.items.length };
        verified += scored.length;
        if (category.weight && scored.length) { weightedSum += average * category.weight; activeWeight += category.weight; }
      });
      return { score: activeWeight ? weightedSum / activeWeight : 0, verified, total: inspectionItemCount(), unverified: inspectionItemCount() - verified, categories };
    }

    function calculateRisk(candidate) {
      const inspection = calculateInspection(candidate.id);
      const unverifiedRate = inspection.total ? inspection.unverified / inspection.total : 1;
      let points = unverifiedRate * 18;
      const reasons = [];
      if (inspection.unverified > 0) reasons.push(`${inspection.unverified} item(ns) da inspeção não verificado(s)`);
      if (!candidate.historyKnown) { points += 8; reasons.push("histórico ausente ou incompleto"); }
      const contradictions = nonNegative(candidate.contradictions);
      if (contradictions) { points += Math.min(15, contradictions * 4); reasons.push(`${contradictions} contradição(ões) registrada(s)`); }
      const criticalRepairs = candidateRepairs(candidate.id).filter(r => r.priority === "SEGURANÇA" || nonNegative(r.severity) >= 4);
      if (criticalRepairs.length) { points += Math.min(20, criticalRepairs.length * 5); reasons.push(`${criticalRepairs.length} reparo(s) crítico(s)`); }
      if (candidate.coldEngine === "AQUECIDO") { points += 5; reasons.push("motor aquecido antes da visita"); }
      if (candidate.testDrive !== "SIM") { points += 10; reasons.push("teste de rodagem não confirmado"); }
      const autoValue = Math.round(nonNegative(candidate.askingPrice) * Math.min(.30, points / 200));
      const manual = candidate.manualRiskEnabled ? nonNegative(candidate.manualRiskValue) : autoValue;
      return { value: manual, automaticValue: autoValue, points: Math.round(points), reasons: reasons.length ? reasons : ["sem fatores adicionais registrados"] };
    }

    function calculateAcquisitionCost(candidate, negotiatedPrice = null) {
      const price = negotiatedPrice === null ? nonNegative(candidate.negotiatedPrice || candidate.askingPrice) : nonNegative(negotiatedPrice);
      const immediateRepairs = candidateRepairs(candidate.id, "IMEDIATO").reduce((sum, repair) => sum + calculateRepairExpected(repair), 0);
      const specificTools = candidateRepairs(candidate.id, "IMEDIATO").reduce((sum, repair) => sum + nonNegative(repair.toolCost), 0);
      const risk = calculateRisk(candidate).value;
      const total = price + nonNegative(candidate.transportCost) + nonNegative(candidate.documentCost) + nonNegative(candidate.debts) + nonNegative(candidate.transferCost) + nonNegative(candidate.initialInsurance) + immediateRepairs + specificTools + risk;
      const ownHours = candidateRepairs(candidate.id, "IMEDIATO").reduce((sum, repair) => sum + nonNegative(repair.ownHours), 0);
      return { price, immediateRepairs, specificTools, risk, total, economicTotal: total + ownHours * nonNegative(state.settings.ownHourValue), ownHours };
    }

    function calculateAdReliability(candidate) {
      let score = 100;
      const alerts = [];
      const penalties = [
        [candidate.priceOutlier, 15, "Preço fora do padrão informado"],
        [nonNegative(candidate.contradictions) > 0, Math.min(25, nonNegative(candidate.contradictions) * 7), "Informações contraditórias"],
        [candidate.pressurePayment, 25, "Pressão por pagamento"],
        [candidate.refusesInspection, 30, "Recusa de vistoria"],
        [candidate.ownerUnknown, 20, "Proprietário não identificado"],
        [!candidate.sellerName, 5, "Vendedor não identificado"],
        [!candidate.mileage, 4, "Quilometragem ausente"],
        [!candidate.link && !candidate.adText, 4, "Origem do anúncio pouco documentada"]
      ];
      penalties.forEach(([condition, value, text]) => { if (condition) { score -= value; alerts.push(text); } });
      return { score: Math.max(0, Math.round(score)), alerts };
    }

    function documentStatus(candidate) {
      if (candidate.transferImpossible || candidate.documentationStatus === "IRREGULAR") return "IRREGULAR";
      const required = [candidate.docRegular, candidate.ownerApt, candidate.chassisChecked, candidate.engineChecked, candidate.transferViable];
      return required.every(Boolean) ? "CONFIRMADA" : "NÃO CONFIRMADA";
    }

    function recommendation(candidate) {
      const docs = documentStatus(candidate);
      if (docs === "IRREGULAR") return "REPROVAR";
      if (candidate.runs !== true || candidate.testDrive !== "SIM") return "REPROVAR";
      if (docs !== "CONFIRMADA") return "NEGOCIAR";
      const score = calculateInspection(candidate.id).score;
      const risk = calculateRisk(candidate).points;
      if (score && score < 2.2) return "LEVAR AO MECÂNICO";
      if (risk > 28) return "LEVAR AO MECÂNICO";
      return "COMPRAR";
    }

    function calculateOffers(candidate) {
      const asking = nonNegative(candidate.askingPrice);
      const fipe = nonNegative(candidate.fipe);
      const peers = state.candidates.filter(item => item.id !== candidate.id && nonNegative(item.askingPrice) > 0);
      const peerAverage = peers.length ? peers.reduce((sum, item) => sum + nonNegative(item.askingPrice), 0) / peers.length : 0;
      const repairs = candidateRepairs(candidate.id).reduce((sum, item) => sum + calculateRepairExpected(item), 0);
      const extras = nonNegative(candidate.transportCost) + nonNegative(candidate.documentCost) + nonNegative(candidate.debts) + nonNegative(candidate.transferCost) + calculateRisk(candidate).value;
      const references = [asking, fipe, peerAverage].filter(value => value > 0);
      if (!references.length) return { aggressive: null, fair: null, maximum: null, basis: "Sem preço pedido, FIPE ou semelhantes informados." };
      const base = Math.min(...references);
      const maximum = Math.max(0, base - repairs - extras);
      return {
        aggressive: Math.max(0, maximum * .88),
        fair: Math.max(0, maximum * .95),
        maximum,
        basis: `Referência menor: ${money(base)}; reparos e custos abatidos: ${money(repairs + extras)}.`
      };
    }

    function projectReserve(months = 12) {
      const start = new Date();
      start.setDate(1);
      const result = [];
      let conservative = nonNegative(state.finance.currentReserve);
      let optimistic = conservative;
      for (let i = 0; i < months; i++) {
        const date = new Date(start); date.setMonth(start.getMonth() + i);
        const monthKey = date.toISOString().slice(0, 7);
        state.contributions.filter(item => String(item.date || "").slice(0, 7) === monthKey && item.status !== "DISPONÍVEL").forEach(item => {
          if (item.status === "GARANTIDO") { conservative += nonNegative(item.min); optimistic += nonNegative(item.max || item.min); }
          if (item.status === "PROVÁVEL") optimistic += nonNegative(item.max || item.min);
        });
        result.push({ date: monthKey, conservative, optimistic });
      }
      return result;
    }

    function safePurchaseMaximum() {
      const reserve = nonNegative(state.finance.currentReserve);
      const emergencyBuffer = Math.max(500, reserve * .15);
      return Math.max(0, reserve - emergencyBuffer);
    }

    function loanPayment(principal, monthlyRate, periods) {
      principal = nonNegative(principal); monthlyRate = nonNegative(monthlyRate) / 100; periods = Math.max(1, Math.round(nonNegative(periods)));
      if (!monthlyRate) return principal / periods;
      return principal * monthlyRate * Math.pow(1 + monthlyRate, periods) / (Math.pow(1 + monthlyRate, periods) - 1);
    }

    function simulateLoan(data) {
      const principal = nonNegative(data.principal);
      const rate = nonNegative(data.rate);
      const periods = Math.max(1, Math.round(nonNegative(data.periods)));
      const fees = nonNegative(data.fees) + nonNegative(data.insurance);
      const installment = loanPayment(principal, rate, periods);
      const total = installment * periods + fees;
      return { principal, rate, periods, installment, fees, total, interest: Math.max(0, total - principal - fees) };
    }

    function amortizationComparison(data) {
      const base = simulateLoan(data);
      const extra = nonNegative(data.extraPayment);
      const after = Math.max(0, Math.round(nonNegative(data.extraAfter || 1)));
      if (!extra || after >= base.periods) return { base, reduceTerm: base, reducePayment: base, savingTerm: 0, savingPayment: 0 };
      const monthlyRate = base.rate / 100;
      let balance = base.principal;
      let paidBefore = 0;
      for (let i = 0; i < after && balance > 0; i++) {
        const interest = balance * monthlyRate;
        const principalPart = Math.max(0, base.installment - interest);
        balance = Math.max(0, balance - principalPart);
        paidBefore += base.installment;
      }
      balance = Math.max(0, balance - extra);
      let termBalance = balance, remainingTerm = 0, termPaid = paidBefore + extra;
      while (termBalance > .01 && remainingTerm < 1200) {
        const interest = termBalance * monthlyRate;
        const payment = Math.min(base.installment, termBalance + interest);
        const principalPart = Math.max(0, payment - interest);
        termBalance = Math.max(0, termBalance - principalPart);
        termPaid += payment;
        remainingTerm++;
      }
      const remainingOriginal = Math.max(1, base.periods - after);
      const reducedPayment = loanPayment(balance, base.rate, remainingOriginal);
      const paymentTotal = paidBefore + extra + reducedPayment * remainingOriginal + base.fees;
      const termTotal = termPaid + base.fees;
      return {
        base,
        reduceTerm: { ...base, periods: after + remainingTerm, installment: base.installment, total: termTotal, interest: Math.max(0, termTotal - base.principal - base.fees) },
        reducePayment: { ...base, periods: base.periods, installment: reducedPayment, total: paymentTotal, interest: Math.max(0, paymentTotal - base.principal - base.fees) },
        savingTerm: Math.max(0, base.total - termTotal),
        savingPayment: Math.max(0, base.total - paymentTotal)
      };
    }

    function calculateFuelMetrics() {
      const full = [...state.fuelLogs].filter(item => item.fullTank && nonNegative(item.km) > 0 && nonNegative(item.liters) > 0).sort((a,b) => nonNegative(a.km) - nonNegative(b.km));
      return full.map((log, index) => {
        if (!index) return { ...log, consumption: null, costKm: null, realRange: null, difference: null };
        const previous = full[index - 1];
        const distance = nonNegative(log.km) - nonNegative(previous.km);
        const consumption = distance > 0 ? distance / nonNegative(log.liters) : null;
        const costKm = distance > 0 ? nonNegative(log.total) / distance : null;
        const realRange = consumption && nonNegative(log.tankCapacity) ? consumption * nonNegative(log.tankCapacity) : null;
        const indicated = nonNegative(log.indicatedRange);
        const difference = realRange && indicated ? Math.abs(realRange - indicated) / realRange * 100 : null;
        return { ...log, distance, consumption, costKm, realRange, difference };
      });
    }

    function calculateFmea(item) {
      const severity = clamp(Math.round(nonNegative(item.severity)), 1, 10);
      const occurrence = clamp(Math.round(nonNegative(item.occurrence)), 1, 10);
      const detection = clamp(Math.round(nonNegative(item.detection)), 1, 10);
      const npr = severity * occurrence * detection;
      let band = npr <= nonNegative(state.settings.fmeaLowMax) ? "BAIXO" : npr <= nonNegative(state.settings.fmeaMediumMax) ? "MÉDIO" : "ALTO";
      if (severity >= 9) band = "ALTO";
      return { severity, occurrence, detection, npr, band };
    }

    function calculateRepairProgress() {
      const result = {};
      Object.keys(PRIORITY_ORDER).forEach(priority => {
        const list = state.repairs.filter(item => item.priority === priority && !item.candidateId);
        const complete = list.filter(item => item.status === "RESOLVIDO").length;
        result[priority] = { total: list.length, complete, percent: list.length ? complete / list.length * 100 : 0, spent: list.reduce((s,r) => s + nonNegative(r.actualCost), 0), remaining: list.filter(r => r.status !== "RESOLVIDO").reduce((s,r) => s + calculateRepairExpected(r), 0) };
      });
      return result;
    }

    function recommendedRepair() {
      return state.repairs.filter(item => !item.candidateId && item.status !== "RESOLVIDO").sort((a,b) => {
        const priority = (PRIORITY_ORDER[a.priority] || 9) - (PRIORITY_ORDER[b.priority] || 9);
        if (priority) return priority;
        const criticality = nonNegative(b.severity) - nonNegative(a.severity);
        if (criticality) return criticality;
        const affordableA = calculateRepairExpected(a) <= nonNegative(state.finance.currentReserve) ? 0 : 1;
        const affordableB = calculateRepairExpected(b) <= nonNegative(state.finance.currentReserve) ? 0 : 1;
        return affordableA - affordableB;
      })[0] || null;
    }

    function calculateGnv(data) {
      const monthlyKm = nonNegative(data.monthlyKm);
      const gasConsumption = nonNegative(data.gasConsumption);
      const gasPrice = nonNegative(data.gasPrice);
      const gnvConsumption = nonNegative(data.gnvConsumption);
      const gnvPrice = nonNegative(data.gnvPrice);
      const gasCostKm = gasConsumption ? gasPrice / gasConsumption : null;
      const gnvCostKm = gnvConsumption ? gnvPrice / gnvConsumption : null;
      const monthlySavings = gasCostKm !== null && gnvCostKm !== null ? Math.max(0, (gasCostKm - gnvCostKm) * monthlyKm - nonNegative(data.extraMonthly)) : null;
      const investment = nonNegative(data.kitCost) + nonNegative(data.documentCost) + nonNegative(data.inspectionCost);
      const payback = monthlySavings > 0 ? investment / monthlySavings : null;
      return { gasCostKm, gnvCostKm, monthlySavings, annualSavings: monthlySavings === null ? null : monthlySavings * 12, payback };
    }

    function calculateProjectCosts() {
      const fuel = state.fuelLogs.reduce((s,x) => s + nonNegative(x.total), 0);
      const maintenance = state.repairs.reduce((s,x) => s + nonNegative(x.actualCost), 0) + state.records.filter(x => x.type === "MANUTENÇÃO" || x.type === "SERVIÇO").reduce((s,x) => s + nonNegative(x.cost), 0);
      const insurance = state.insuranceQuotes.filter(x => x.purchased).reduce((s,x) => s + nonNegative(x.annualPrice), 0);
      const other = state.records.filter(x => x.type === "DESPESA").reduce((s,x) => s + nonNegative(x.cost), 0);
      const km = state.vehicle ? Math.max(0, nonNegative(state.vehicle.currentKm) - nonNegative(state.vehicle.purchaseKm)) : 0;
      const operational = fuel + maintenance + insurance + other + nonNegative(state.settings.garageMonthly) * monthsSince(state.vehicle?.purchaseDate);
      const acquisition = state.vehicle ? nonNegative(state.vehicle.acquisitionTotal) : 0;
      const tools = state.tools.reduce((s,x) => s + nonNegative(x.price), 0);
      return { km, operational, acquisition, tools, operationalPerKm: km ? operational / km : null, totalPerKm: km ? (operational + acquisition + (state.settings.includeReusableTools ? tools : 0)) / km : null };
    }

    // ===========================
    // VALIDATION
    // ===========================
    function validateForm(form) {
      let valid = true;
      form.querySelectorAll("[required]").forEach(field => {
        const ok = String(field.value || "").trim() !== "";
        field.classList.toggle("invalid", !ok);
        if (!ok) valid = false;
      });
      form.querySelectorAll("input[type='number']").forEach(field => {
        const value = safeNumber(field.value);
        const ok = field.value === "" || (Number.isFinite(value) && (field.min === "" || value >= safeNumber(field.min)));
        field.classList.toggle("invalid", !ok);
        if (!ok) valid = false;
      });
      if (!valid) toast("Revise os campos obrigatórios ou inválidos.", "error");
      return valid;
    }

    function ensurePurchaseEligible(candidate) {
      if (documentStatus(candidate) !== "CONFIRMADA") { toast("A compra exige documentação confirmada e transferência viável.", "error"); return false; }
      if (!candidate.docCheckedToday) { toast("Confirme uma nova consulta documental no dia da compra.", "error"); return false; }
      if (!candidate.runs || candidate.testDrive !== "SIM") { toast("O veículo precisa funcionar e permitir teste de rodagem.", "error"); return false; }
      return true;
    }

    // ===========================
    // UTILS
    // ===========================
    function uid() { return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`); }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function inspectionItemCount() { return INSPECTION_DEFINITION.reduce((sum, category) => sum + category.items.length, 0); }
    function byId(id) { return document.getElementById(id); }
    function escapeHtml(value = "") { return String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char])); }
    function attr(value = "") { return escapeHtml(value); }
    function money(value) { const n = safeNumber(value); return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(n); }
    function number(value, digits = 1) { const n = safeNumber(value); return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: digits }).format(n); }
    function optionalMoney(value) { return value === null || value === undefined || value === "" ? "Não informado" : money(value); }
    function localDateISO(date = new Date()) { const d = new Date(date.getTime() - date.getTimezoneOffset() * 60000); return d.toISOString().slice(0, 10); }
    function dateLabel(value) { if (!value) return "Não informado"; const parts = String(value).slice(0,10).split("-"); return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : escapeHtml(value); }
    function monthLabel(value) { if (!value) return ""; const [year, month] = value.split("-"); return new Date(Number(year), Number(month) - 1, 1).toLocaleDateString("pt-BR", { month: "short", year: "numeric" }); }
    function monthsSince(value) { if (!value) return 0; const start = new Date(`${value}T12:00:00`); const now = new Date(); return Math.max(0, (now.getFullYear()-start.getFullYear())*12 + now.getMonth()-start.getMonth()); }
    function truncate(text, length = 100) { const value = String(text || ""); return value.length > length ? `${value.slice(0,length)}…` : value; }
    function getFormData(form) { const data = {}; new FormData(form).forEach((value,key) => { data[key] = value; }); form.querySelectorAll("input[type='checkbox']").forEach(el => { data[el.name] = el.checked; }); return data; }
    function candidateName(candidate) { return `${candidate.version || "Vectra B"}${candidate.yearModel ? ` ${candidate.yearModel}` : ""}`; }
    function badge(text, color = "blue") { return `<span class="badge ${color}">${escapeHtml(text)}</span>`; }
    function statusColor(text) { return ["COMPRAR","CONFIRMADA","RESOLVIDO","RECEBIDA","ARMAZENADA"].includes(text) ? "green" : ["REPROVAR","IRREGULAR","NÃO RESOLVIDO","CRÍTICO","ALTO"].includes(text) ? "red" : "yellow"; }
    function emptyState(title, text, buttonHtml = "") { return `<div class="empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span>${buttonHtml ? `<div class="section">${buttonHtml}</div>` : ""}</div>`; }
    function selectOptions(options, selected) { return options.map(option => { const value = typeof option === "string" ? option : option.value; const label = typeof option === "string" ? option : option.label; return `<option value="${attr(value)}" ${String(value) === String(selected) ? "selected" : ""}>${escapeHtml(label)}</option>`; }).join(""); }
    function showSaved() { const el = byId("autosave"); el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 900); }
    function toast(message, type = "info") { const el = byId("toast"); el.textContent = message; el.style.borderColor = type === "error" ? "var(--red)" : type === "success" ? "var(--green)" : "var(--blue)"; el.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hidden"), 3200); }
    function confirmAction(message) { return window.confirm(message); }
    function downloadBlob(blob, filename) { const url = URL.createObjectURL(blob); const anchor = document.createElement("a"); anchor.href = url; anchor.download = filename; document.body.appendChild(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
    function storageEstimate() { const json = JSON.stringify(state); const bytes = new Blob([json]).size; const images = state.candidates.reduce((sum,c) => sum + (c.images || []).length, 0); return { bytes, images, label: bytes < 1048576 ? `${number(bytes/1024,0)} KB` : `${number(bytes/1048576,1)} MB` }; }
    function logDecision(decision, context, alternative = "", justification = "", values = "") { state.decisions.unshift({ id: uid(), date: new Date().toISOString(), decision, context, alternative, justification, values }); }
    function findCandidate(id) { return state.candidates.find(item => item.id === id); }
    function findRepair(id) { return state.repairs.find(item => item.id === id); }
    function findPart(id) { return state.parts.find(item => item.id === id); }
    function parseMoneyText(text) { const matches = String(text).match(/R\$\s*([\d.]+(?:,\d{1,2})?)/i); return matches ? safeNumber(matches[1].replace(/\./g, "").replace(",", ".")) : 0; }
    function extractAdData(text) {
      const clean = String(text || "");
      const years = clean.match(/\b(19\d{2}|20\d{2})(?:\s*[\/\-]\s*(\d{2,4}))?\b/);
      const km = clean.match(/([\d.]{2,})\s*(?:km|quilômetros|quilometragem)/i);
      const motor = clean.match(/\b(2[.,][02])\b/);
      const valves = clean.match(/\b(8|16)\s*[vV](?:álvulas)?\b/i);
      const defects = clean.split(/[.!?\n]+/).filter(line => /(defeito|vazamento|ruído|fumaça|não funciona|precisa|problema|avaria|sinistro|leilão)/i.test(line)).slice(0,6).join("; ");
      const inconsistencies = [];
      if (/automátic/i.test(clean)) inconsistencies.push("Anúncio menciona câmbio automático — fora do perfil principal.");
      if (/não liga|motor desmontado|sem motor/i.test(clean)) inconsistencies.push("Pode não atender à condição mínima de ligar e permitir teste.");
      return { price: parseMoneyText(clean), yearMake: years ? safeNumber(years[1]) : "", yearModel: years ? safeNumber(years[2] ? (years[2].length === 2 ? `${String(years[1]).slice(0,2)}${years[2]}` : years[2]) : years[1]) : "", mileage: km ? safeNumber(km[1].replace(/\./g,"")) : "", motor: motor ? motor[1].replace(",", ".") : "", valves: valves ? valves[1] : "", defects, inconsistencies: inconsistencies.join(" ") };
    }

    function compressImage(file, maxDimension = 1280, quality = .72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const image = new Image();
          image.onerror = reject;
          image.onload = () => {
            let width = image.width, height = image.height;
            const scale = Math.min(1, maxDimension / Math.max(width, height));
            width = Math.round(width * scale); height = Math.round(height * scale);
            const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(image, 0, 0, width, height);
            resolve({ id: uid(), name: file.name, type: "image/jpeg", data: canvas.toDataURL("image/jpeg", quality), originalBytes: file.size, compressedBytes: Math.round(canvas.toDataURL("image/jpeg", quality).length * .75) });
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ===========================
    // RENDER
    // ===========================
    function render() {
      buildAlerts();
      const app = byId("app");
      const renderers = { home: renderHome, acquisition: renderAcquisition, repairs: renderRepairs, records: renderRecords, parts: renderParts };
      app.innerHTML = (renderers[currentRoute] || renderHome)();
      document.querySelectorAll(".nav-btn").forEach(button => button.classList.toggle("active", button.dataset.route === currentRoute));
      byId("phaseLabel").textContent = state.vehicle ? "Fase Reforma / Operação" : "Fase Aquisição";
    }

    function buildAlerts() {
      const alerts = [];
      const now = new Date();
      if (!state.meta.lastBackup || (now - new Date(state.meta.lastBackup)) / 86400000 > 30) alerts.push({ id: "backup", level: "MÉDIO", title: "Backup pendente", due: "", text: state.meta.lastBackup ? "O último backup tem mais de 30 dias." : "Nenhum backup foi exportado ainda." });
      state.candidates.forEach(candidate => {
        const docs = documentStatus(candidate);
        if (docs === "IRREGULAR") alerts.push({ id: `doc-${candidate.id}`, level: "CRÍTICO", title: `${candidateName(candidate)}: documentação irregular`, due: "", text: "Transferência inviável ou irregularidade confirmada." });
        else if (docs !== "CONFIRMADA") alerts.push({ id: `doc-${candidate.id}`, level: "ALTO", title: `${candidateName(candidate)}: documentação não confirmada`, due: "", text: "Não pode receber recomendação COMPRAR." });
      });
      if (state.vehicle && !state.beltLogs.length) alerts.push({ id: "belt", level: "CRÍTICO", title: "Correia dentada sem comprovação", due: "", text: "Trate como prioridade imediata até registrar comprovação confiável." });
      if (state.vehicle && !state.oilLogs.length) alerts.push({ id: "oil-history", level: "ALTO", title: "Óleo do motor sem histórico registrado", due: "", text: `Intervalo inicial configurado: ${number(state.settings.oilKm, 0)} km ou ${number(state.settings.oilMonths, 0)} meses.` });
      const lastOil = [...state.oilLogs].sort((a,b) => String(b.date).localeCompare(String(a.date)))[0];
      if (lastOil) {
        const dueKm = nonNegative(lastOil.km) + nonNegative(state.settings.oilKm);
        const dueDate = new Date(`${lastOil.date}T12:00:00`); dueDate.setMonth(dueDate.getMonth() + nonNegative(state.settings.oilMonths));
        if ((state.vehicle && nonNegative(state.vehicle.currentKm) >= dueKm) || now >= dueDate) alerts.push({ id: "oil-due", level: "ALTO", title: "Troca de óleo vencida", due: localDateISO(dueDate), text: `Vencimento por ${number(dueKm,0)} km ou ${dateLabel(localDateISO(dueDate))}, o que ocorresse primeiro.` });
      }
      state.fluids.filter(item => item.dueDate && new Date(`${item.dueDate}T23:59:59`) <= new Date(now.getTime() + 45 * 86400000)).forEach(item => alerts.push({ id: `fluid-${item.id}`, level: new Date(`${item.dueDate}T23:59:59`) < now ? "ALTO" : "MÉDIO", title: `Fluido a revisar: ${item.type}`, due: item.dueDate, text: item.specification || "Especificação não informada." }));
      state.beltLogs.filter(item => (item.dueDate && new Date(`${item.dueDate}T23:59:59`) <= new Date(now.getTime() + 45 * 86400000)) || (state.vehicle && nonNegative(item.dueKm) && nonNegative(state.vehicle.currentKm) >= nonNegative(item.dueKm))).forEach(item => alerts.push({ id: `belt-${item.id}`, level: "CRÍTICO", title: "Correia dentada no limite registrado", due: item.dueDate || "", text: item.dueKm ? `Limite informado: ${number(item.dueKm,0)} km.` : "Data de troca/revisão atingida." }));
      state.repairs.filter(item => item.followUpDate && item.status === "RESOLVIDO" && new Date(`${item.followUpDate}T23:59:59`) <= new Date(now.getTime() + 15 * 86400000)).forEach(item => alerts.push({ id: `repair-review-${item.id}`, level: "MÉDIO", title: `Validar reparo: ${item.title}`, due: item.followUpDate, text: item.validation || "Executar teste de validação e registrar possível reincidência." }));
      state.repairs.filter(item => nonNegative(item.reincidences) >= 2).forEach(item => alerts.push({ id: `unreliable-${item.id}`, level: nonNegative(item.severity) >= 4 ? "CRÍTICO" : "ALTO", title: `Solução possivelmente não confiável: ${item.title}`, due: "", text: `Reincidências: ${number(item.reincidences,0)}. Compare reparar, substituir, adaptar equivalente ou investigar sistema relacionado.` }));
      state.fmea.forEach(item => { const calc = calculateFmea(item); if (calc.band === "ALTO") alerts.push({ id: `fmea-${item.id}`, level: "ALTO", title: `FMEA prioritária: ${item.title}`, due: item.dueDate || "", text: `NPR ${calc.npr}; gravidade ${calc.severity}.` }); });
      state.parts.forEach(part => {
        if (nonNegative(part.quantity) < nonNegative(part.minimum)) alerts.push({ id: `part-${part.id}`, level: part.critical ? "ALTO" : "MÉDIO", title: `Estoque abaixo do mínimo: ${part.name}`, due: "", text: `${number(part.quantity,0)} disponível(is); mínimo ${number(part.minimum,0)}.` });
        if (part.availability === "RARA" && part.critical) alerts.push({ id: `rare-${part.id}`, level: "ALTO", title: `Peça crítica rara: ${part.name}`, due: "", text: "Avalie aquisição para estoque estratégico." });
        if (part.validity && new Date(`${part.validity}T23:59:59`) <= new Date(now.getTime() + 60 * 86400000)) alerts.push({ id: `validity-${part.id}`, level: "MÉDIO", title: `Validade/deterioração: ${part.name}`, due: part.validity, text: "Inspecione a condição da peça armazenada." });
      });
      state.documents.filter(doc => doc.dueDate && new Date(`${doc.dueDate}T23:59:59`) >= now).forEach(doc => {
        const days = (new Date(`${doc.dueDate}T23:59:59`) - now) / 86400000;
        if (days <= 45) alerts.push({ id: `document-${doc.id}`, level: days <= 10 ? "ALTO" : "MÉDIO", title: `Documento a vencer: ${doc.type}`, due: doc.dueDate, text: doc.notes || "Verifique a renovação/regularização." });
      });
      state.alerts = alerts.sort((a,b) => (ALERT_ORDER[a.level] || 9) - (ALERT_ORDER[b.level] || 9) || String(a.due || "9999").localeCompare(String(b.due || "9999")));
    }

    function renderHome() {
      return state.vehicle ? renderReformDashboard() : renderAcquisitionDashboard();
    }

    function renderAcquisitionDashboard() {
      const sorted = [...state.candidates].sort((a,b) => calculateAcquisitionCost(a).total - calculateAcquisitionCost(b).total);
      const best = sorted.find(candidate => recommendation(candidate) !== "REPROVAR");
      const projection = projectReserve(6);
      return `
        <div class="page-title"><div><div class="eyebrow">Fase atual</div><h1>Aquisição</h1><p class="muted">Decisão baseada em custo total viável, risco controlável e documentação regular.</p></div></div>
        <div class="grid three">
          <article class="card metric accent"><span class="label">Reserva disponível hoje</span><span class="value">${money(state.finance.currentReserve)}</span><span class="sub">Dinheiro futuro não incluído</span></article>
          <article class="card metric"><span class="label">Melhor Vectra encontrado</span><span class="value">${best ? escapeHtml(candidateName(best)) : "A pesquisar"}</span><span class="sub">${best ? `Custo total ${money(calculateAcquisitionCost(best).total)}` : "Cadastre o primeiro anúncio"}</span></article>
          <article class="card metric"><span class="label">Máximo seguro hoje</span><span class="value">${money(safePurchaseMaximum())}</span><span class="sub">Reserva menos colchão de 15% (mín. R$ 500)</span></article>
        </div>
        ${renderCriticalAlerts(3)}
        <section class="section">
          <div class="section-head"><h2>Linha do tempo financeira</h2><button class="btn small" data-action="open-finance">GERENCIAR</button></div>
          <div class="card timeline">${projection.map(item => `<div class="timeline-item"><div class="timeline-dot"></div><div><strong>${monthLabel(item.date)}</strong><br><small>Conservador ${money(item.conservative)} · Otimista ${money(item.optimistic)}</small></div></div>`).join("")}</div>
        </section>
        <section class="section">
          <div class="section-head"><h2>Candidatos interessantes</h2><button class="btn primary small" data-action="new-candidate">NOVO ANÚNCIO</button></div>
          ${sorted.length ? `<div class="list">${sorted.slice(0,3).map(renderCandidateCompact).join("")}</div>` : emptyState("Nenhum candidato cadastrado.", "Cadastre seu primeiro anúncio real para iniciar a triagem.", `<button class="btn primary" data-action="new-candidate">CADASTRAR ANÚNCIO</button>`)}
        </section>
        <section class="section card"><h2>Próximos passos</h2><div class="list">
          <div class="list-item">1. Cadastre anúncios e confirme que o câmbio é manual.</div>
          <div class="list-item">2. Faça a triagem documental antes de deslocar-se.</div>
          <div class="list-item">3. Inspecione, estime reparos e compare o custo total.</div>
        </div></section>`;
    }

    function renderReformDashboard() {
      const progress = calculateRepairProgress();
      const next = recommendedRepair();
      const costs = calculateProjectCosts();
      return `
        <div class="page-title"><div><div class="eyebrow">Fase atual</div><h1>Reforma e confiabilidade</h1><p class="muted">${escapeHtml(candidateName(state.vehicle))} · ${number(state.vehicle.currentKm || state.vehicle.purchaseKm,0)} km</p></div></div>
        <div class="grid three">
          <article class="card metric accent"><span class="label">Próximo reparo prioritário</span><span class="value">${next ? escapeHtml(next.title) : "Nenhum pendente"}</span><span class="sub">${next ? `${next.priority} · ${money(calculateRepairExpected(next))}` : "Cadastre ou revise reparos"}</span></article>
          <article class="card metric"><span class="label">Disponível / necessário</span><span class="value">${money(state.finance.currentReserve)}</span><span class="sub">Pendente: ${money(state.repairs.filter(r=>!r.candidateId && r.status!=="RESOLVIDO").reduce((s,r)=>s+calculateRepairExpected(r),0))}</span></article>
          <article class="card metric"><span class="label">Custo operacional / km</span><span class="value">${costs.operationalPerKm === null ? "Aguardando km" : money(costs.operationalPerKm)}</span><span class="sub">Custo total/km: ${costs.totalPerKm === null ? "Não calculável" : money(costs.totalPerKm)}</span></article>
        </div>
        ${renderCriticalAlerts(4)}
        <section class="section"><div class="section-head"><h2>Progresso da reforma</h2><button class="btn small" data-route-target="repairs">ABRIR REFORMA</button></div><div class="grid two">
          ${Object.entries(progress).map(([key,value]) => `<div class="card"><div class="list-item-head"><strong>${key}</strong><span>${number(value.percent,0)}%</span></div><div class="progress ${key === "SEGURANÇA" ? "red" : key === "CONFIABILIDADE" ? "yellow" : ""}"><span style="width:${clamp(value.percent,0,100)}%"></span></div><small>${value.complete}/${value.total} · Gasto ${money(value.spent)} · Restante ${money(value.remaining)}</small></div>`).join("")}
        </div></section>
        <section class="section"><div class="section-head"><h2>Atalhos operacionais</h2></div><div class="grid two">
          <button class="btn block" data-action="new-repair">NOVO REPARO</button>
          <button class="btn block" data-action="new-record">NOVO REGISTRO</button>
          <button class="btn block" data-action="open-costs">CUSTOS DO PROJETO</button>
          <button class="btn block" data-action="open-reports">RELATÓRIOS</button>
        </div></section>`;
    }

    function renderCriticalAlerts(limit = 5) {
      const items = state.alerts.slice(0,limit);
      if (!items.length) return "";
      return `<section class="section"><div class="section-head"><h2>Alertas críticos</h2><button class="btn small" data-action="open-alerts">VER TODOS</button></div><div class="list">${items.map(alert => `<article class="list-item alert-item" data-level="${alert.level}"><div class="list-item-head"><div><strong>${escapeHtml(alert.title)}</strong><br><small>${escapeHtml(alert.text)}</small></div>${badge(alert.level,statusColor(alert.level))}</div>${alert.due ? `<small>Vencimento: ${dateLabel(alert.due)}</small>` : ""}</article>`).join("")}</div></section>`;
    }

    function renderCandidateCompact(candidate) {
      const cost = calculateAcquisitionCost(candidate);
      const inspection = calculateInspection(candidate.id);
      const rec = recommendation(candidate);
      return `<article class="list-item"><div class="list-item-head"><div><h3>${escapeHtml(candidateName(candidate))}</h3><small>${escapeHtml(candidate.city || "Local não informado")} · ${candidate.mileage ? `${number(candidate.mileage,0)} km` : "km não informado"}</small></div>${badge(rec,statusColor(rec))}</div><div class="chips"><span class="chip">Pedido ${money(candidate.askingPrice)}</span><span class="chip">Total ${money(cost.total)}</span><span class="chip">Nota ${inspection.verified ? number(inspection.score,1) : "não inspecionado"}</span></div><div class="list-actions"><button class="btn small" data-action="candidate-detail" data-id="${candidate.id}">ABRIR</button><button class="btn small" data-action="inspection" data-id="${candidate.id}">INSPEÇÃO</button></div></article>`;
    }

    function renderAcquisition() {
      const sorted = [...state.candidates].sort((a,b) => calculateAcquisitionCost(a).total - calculateAcquisitionCost(b).total);
      const compared = state.candidates.filter(item => item.compare);
      return `
        <div class="page-title"><div><div class="eyebrow">Anúncio → triagem → visita → inspeção</div><h1>Aquisição</h1><p class="muted">${state.candidates.length} candidato(s) · comparação ${compared.length}/3</p></div><button class="btn primary small" data-action="new-candidate">NOVO</button></div>
        <div class="button-row no-print"><button class="btn" data-action="open-finance">FINANÇAS</button><button class="btn" data-action="compare">COMPARAR (${compared.length})</button><button class="btn" data-action="open-insurance">SEGUROS</button><button class="btn" data-action="open-tools">FERRAMENTAS</button></div>
        <section class="section">${sorted.length ? `<div class="list">${sorted.map(renderCandidateCard).join("")}</div>` : emptyState("Nenhum candidato cadastrado.", "Cole o texto de um anúncio; o sistema tentará extrair os dados localmente.", `<button class="btn primary" data-action="new-candidate">CADASTRAR PRIMEIRO ANÚNCIO</button>`)}</section>
        <section class="section card"><h2>Fluxo de decisão</h2><div class="chips"><span class="chip">ANÚNCIO</span><span>→</span><span class="chip">TRIAGEM</span><span>→</span><span class="chip">VISITA</span><span>→</span><span class="chip">INSPEÇÃO</span><span>→</span><span class="chip">COMPARAÇÃO</span><span>→</span><span class="chip">OFERTA</span><span>→</span><span class="chip">COMPRA</span></div></section>`;
    }

    function renderCandidateCard(candidate) {
      const cost = calculateAcquisitionCost(candidate);
      const reliability = calculateAdReliability(candidate);
      const inspection = calculateInspection(candidate.id);
      const docs = documentStatus(candidate);
      const rec = recommendation(candidate);
      const image = candidate.images?.[0]?.data;
      return `<article class="card ${docs === "IRREGULAR" ? "critical" : ""}">
        ${image ? `<img src="${image}" alt="Imagem do anúncio" style="width:100%;height:150px;object-fit:cover;border-radius:9px;margin-bottom:10px">` : ""}
        <div class="list-item-head"><div><h2>${escapeHtml(candidateName(candidate))}</h2><small>${escapeHtml(candidate.source || "Fonte não informada")} · ${escapeHtml(candidate.city || "Local não informado")}</small></div>${badge(rec,statusColor(rec))}</div>
        <div class="grid two section"><div class="metric"><span class="label">Preço pedido</span><span class="value">${money(candidate.askingPrice)}</span></div><div class="metric"><span class="label">Custo total estimado</span><span class="value">${money(cost.total)}</span></div></div>
        <div class="chips"><span class="chip">Documento: ${docs}</span><span class="chip">Anúncio: ${reliability.score}/100</span><span class="chip">Técnica: ${inspection.verified ? number(inspection.score,1) : "A avaliar"}</span><span class="chip">Risco: ${money(cost.risk)}</span></div>
        <div class="checkline section"><input type="checkbox" class="compare-check" data-id="${candidate.id}" id="compare-${candidate.id}" ${candidate.compare ? "checked" : ""}><label for="compare-${candidate.id}">Selecionar para comparação (máx. 3)</label></div>
        <div class="list-actions"><button class="btn small primary" data-action="candidate-detail" data-id="${candidate.id}">ABRIR</button><button class="btn small" data-action="inspection" data-id="${candidate.id}">INSPEÇÃO</button><button class="btn small" data-action="offers" data-id="${candidate.id}">OFERTAS</button><button class="btn small danger" data-action="delete-candidate" data-id="${candidate.id}">EXCLUIR</button></div>
      </article>`;
    }

    // ===========================
    // NAVIGATION
    // ===========================
    function navigate(route) {
      currentRoute = route;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelector(".bottom-nav").addEventListener("click", event => {
      const button = event.target.closest("[data-route]");
      if (button) navigate(button.dataset.route);
    });

    document.addEventListener("click", event => {
      const routeTarget = event.target.closest("[data-route-target]");
      if (routeTarget) navigate(routeTarget.dataset.routeTarget);
      const actionTarget = event.target.closest("[data-action]");
      if (actionTarget) handleAction(actionTarget.dataset.action, actionTarget.dataset.id, actionTarget);
    });

    document.addEventListener("change", event => {
      if (event.target.classList.contains("compare-check")) toggleCompare(event.target.dataset.id, event.target.checked);
    });

    function handleAction(action, id, target) {
      const actions = {
        "new-candidate": () => openCandidateForm(),
        "candidate-detail": () => openCandidateDetail(id),
        "delete-candidate": () => deleteCandidate(id),
        "inspection": () => openInspection(id),
        "offers": () => openOffers(id),
        "compare": openComparison,
        "open-finance": openFinance,
        "open-insurance": openInsurance,
        "open-tools": openTools,
        "open-alerts": openAlerts,
        "new-repair": () => openRepairForm(),
        "edit-repair": () => openRepairForm(id),
        "complete-repair": () => openCompleteRepair(id),
        "recur-repair": () => registerRecurrence(id),
        "delete-repair": () => deleteRepair(id),
        "new-record": () => openRecordForm(),
        "record-detail": () => openRecordDetail(id),
        "delete-record": () => deleteRecord(id),
        "new-part": () => openPartForm(),
        "edit-part": () => openPartForm(id),
        "part-detail": () => openPartDetail(id),
        "delete-part": () => deletePart(id),
        "open-costs": openCosts,
        "open-reports": openReports,
        "close-modal": closeModal
      };
      if (actions[action]) actions[action]();
    }

    // ===========================
    // MODALS
    // ===========================
    function openModal(title, body, footer = "", options = {}) {
      const root = byId("modalRoot");
      root.innerHTML = `<div class="modal-backdrop no-print" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle">${escapeHtml(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar">×</button></header><div class="modal-body">${body}</div>${footer ? `<footer class="modal-foot">${footer}</footer>` : ""}</section></div>`;
      if (options.wide) root.querySelector(".modal").style.width = "min(100%, 980px)";
      root.querySelector(".modal")?.focus();
    }

    function closeModal() { byId("modalRoot").innerHTML = ""; }

    function openAlerts() {
      const body = state.alerts.length ? `<div class="list">${state.alerts.map(alert => `<article class="list-item alert-item" data-level="${alert.level}"><div class="list-item-head"><div><strong>${escapeHtml(alert.title)}</strong><br><small>${escapeHtml(alert.text)}</small></div>${badge(alert.level,statusColor(alert.level))}</div>${alert.due ? `<small>Vencimento: ${dateLabel(alert.due)}</small>` : ""}</article>`).join("")}</div>` : emptyState("Sem alertas ativos.", "Os alertas são gerados a partir dos dados locais.");
      openModal("Central de alertas", body, `<button class="btn" data-action="close-modal">FECHAR</button>`);
    }

    // ===========================
    // ACQUISITION
    // ===========================
    function candidateDefaults(candidate = {}) {
      return {
        id: candidate.id || uid(), adText: "", link: "", source: "", yearMake: "", yearModel: "", version: "", motor: "", valves: "", mileage: "", askingPrice: "", negotiatedPrice: "", fipe: "", city: "", distance: "", sellerName: "", sellerPhone: "", declaredDefects: "", inconsistencies: "", notes: "", status: "ANÚNCIO", images: [], historyKnown: false, contradictions: 0, priceOutlier: false, pressurePayment: false, refusesInspection: false, ownerUnknown: false, documentationStatus: "NÃO VERIFICADA", docRegular: false, ownerApt: false, chassisChecked: false, engineChecked: false, transferViable: false, transferImpossible: false, debtsChecked: false, auction: false, accident: false, docProtocol: "", docQueryDate: "", docCheckedToday: false, runs: false, testDrive: "NÃO VERIFICADO", coldEngine: "NÃO VERIFICADO", batteryVoltage: "", obdCodes: "", engineTemperature: "", fuelCorrections: "", visitParameters: "", transportCost: 0, documentCost: 0, debts: 0, transferCost: 0, initialInsurance: 0, manualRiskEnabled: false, manualRiskValue: 0, compare: false, createdAt: new Date().toISOString(), ...candidate
      };
    }

    function openCandidateForm(id = null) {
      const existing = id ? findCandidate(id) : null;
      const c = candidateDefaults(existing || {});
      const body = `<form id="candidateForm">
        <input type="hidden" name="id" value="${c.id}">
        <details open><summary>1. Anúncio e extração local</summary><div class="details-body">
          <div class="field"><label>Texto do anúncio</label><textarea name="adText" id="adText" placeholder="Cole aqui o anúncio completo">${escapeHtml(c.adText)}</textarea><div class="help">A extração usa expressões locais; não acessa nem valida o conteúdo do link.</div></div>
          <button type="button" class="btn block" id="extractAdBtn">EXTRAIR DADOS DO TEXTO</button>
          <div class="form-grid section"><div class="field"><label>Fonte</label><input name="source" value="${attr(c.source)}" placeholder="OLX, Webmotors, indicação..."></div><div class="field"><label>Link</label><input type="url" name="link" value="${attr(c.link)}" placeholder="https://..."></div></div>
        </div></details>
        <details open><summary>2. Veículo</summary><div class="details-body form-grid">
          <div class="field"><label>Ano fabricação</label><input type="number" min="1990" max="2100" name="yearMake" value="${attr(c.yearMake)}"></div>
          <div class="field"><label>Ano modelo</label><input type="number" min="1990" max="2100" name="yearModel" value="${attr(c.yearModel)}"></div>
          <div class="field"><label class="required">Versão / identificação</label><input required name="version" value="${attr(c.version)}" placeholder="GLS, CD ou descrição livre"></div>
          <div class="field"><label>Motor</label><input name="motor" value="${attr(c.motor)}" placeholder="2.0, 2.2..."></div>
          <div class="field"><label>Válvulas</label><input name="valves" value="${attr(c.valves)}" placeholder="8 ou 16"></div>
          <div class="field"><label>Quilometragem</label><input type="number" min="0" name="mileage" value="${attr(c.mileage)}"></div>
          <div class="field"><label class="required">Preço pedido (R$)</label><input required type="number" min="0" step="0.01" name="askingPrice" value="${attr(c.askingPrice)}"></div>
          <div class="field"><label>FIPE informada manualmente (R$)</label><input type="number" min="0" step="0.01" name="fipe" value="${attr(c.fipe)}"><div class="help">Não há consulta automática.</div></div>
          <div class="field"><label>Cidade</label><input name="city" value="${attr(c.city)}"></div>
          <div class="field"><label>Distância (km)</label><input type="number" min="0" name="distance" value="${attr(c.distance)}"></div>
        </div></details>
        <details><summary>3. Vendedor e triagem</summary><div class="details-body form-grid">
          <div class="field"><label>Nome do vendedor</label><input name="sellerName" value="${attr(c.sellerName)}"></div>
          <div class="field"><label>Telefone</label><input name="sellerPhone" value="${attr(c.sellerPhone)}"></div>
          <div class="field wide"><label>Defeitos declarados</label><textarea name="declaredDefects">${escapeHtml(c.declaredDefects)}</textarea></div>
          <div class="field wide"><label>Inconsistências / observações</label><textarea name="inconsistencies">${escapeHtml(c.inconsistencies)}</textarea></div>
          ${checkbox("historyKnown","Histórico conhecido",c.historyKnown)}
          <div class="field"><label>Número de contradições</label><input type="number" min="0" name="contradictions" value="${attr(c.contradictions)}"></div>
          ${checkbox("priceOutlier","Preço informado como muito fora do padrão",c.priceOutlier)}
          ${checkbox("pressurePayment","Vendedor pressiona pagamento",c.pressurePayment)}
          ${checkbox("refusesInspection","Vendedor recusa vistoria",c.refusesInspection)}
          ${checkbox("ownerUnknown","Proprietário não identificado",c.ownerUnknown)}
        </div></details>
        <details><summary>4. Documentação eliminatória</summary><div class="details-body">
          <div class="field"><label>Status informado</label><select name="documentationStatus">${selectOptions(["NÃO VERIFICADA","EM VERIFICAÇÃO","REGULAR","IRREGULAR"],c.documentationStatus)}</select></div>
          <div class="grid two">
            ${checkbox("docRegular","Documentação regular",c.docRegular)}
            ${checkbox("ownerApt","Proprietário/vendedor legalmente apto",c.ownerApt)}
            ${checkbox("chassisChecked","Chassi conferido",c.chassisChecked)}
            ${checkbox("engineChecked","Número do motor conferido",c.engineChecked)}
            ${checkbox("transferViable","Transferência viável",c.transferViable)}
            ${checkbox("transferImpossible","Impossibilidade de transferência confirmada",c.transferImpossible)}
            ${checkbox("debtsChecked","Débitos e restrições consultados",c.debtsChecked)}
            ${checkbox("auction","Leilão",c.auction)}
            ${checkbox("accident","Sinistro",c.accident)}
            ${checkbox("docCheckedToday","Documentação consultada no dia da compra",c.docCheckedToday)}
          </div>
          <div class="form-grid section"><div class="field"><label>Protocolo / número da consulta</label><input name="docProtocol" value="${attr(c.docProtocol)}"></div><div class="field"><label>Data da consulta</label><input type="date" name="docQueryDate" value="${attr(c.docQueryDate)}"></div></div>
        </div></details>
        <details><summary>5. Visita e condição mínima</summary><div class="details-body form-grid">
          ${checkbox("runs","O carro liga e funciona",c.runs)}
          <div class="field"><label>Teste de rodagem</label><select name="testDrive">${selectOptions(["NÃO VERIFICADO","SIM","NÃO AUTORIZADO","NÃO FOI POSSÍVEL"],c.testDrive)}</select></div>
          <div class="field"><label>Motor na chegada</label><select name="coldEngine">${selectOptions(["NÃO VERIFICADO","FRIO","MORNO","AQUECIDO"],c.coldEngine)}</select></div>
          <div class="field"><label>Tensão bateria (V)</label><input type="number" min="0" step="0.01" name="batteryVoltage" value="${attr(c.batteryVoltage)}"></div>
