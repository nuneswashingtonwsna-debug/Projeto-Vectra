          <div class="field wide"><label>Códigos OBD2</label><input name="obdCodes" value="${attr(c.obdCodes)}"></div>
          <div class="field"><label>Temperatura</label><input name="engineTemperature" value="${attr(c.engineTemperature)}"></div>
          <div class="field"><label>Correções de combustível</label><input name="fuelCorrections" value="${attr(c.fuelCorrections)}"></div>
          <div class="field wide"><label>Outros parâmetros / ferramentas usadas</label><textarea name="visitParameters">${escapeHtml(c.visitParameters)}</textarea></div>
        </div></details>
        <details><summary>6. Custos de aquisição</summary><div class="details-body form-grid">
          ${moneyInput("transportCost","Busca, deslocamento e transporte",c.transportCost)}
          ${moneyInput("documentCost","Documentação relacionada",c.documentCost)}
          ${moneyInput("debts","Débitos assumidos",c.debts)}
          ${moneyInput("transferCost","Transferência",c.transferCost)}
          ${moneyInput("initialInsurance","Seguro inicial",c.initialInsurance)}
          ${moneyInput("negotiatedPrice","Preço negociado",c.negotiatedPrice)}
          <div class="field wide">${checkbox("manualRiskEnabled","Ajustar margem de risco manualmente",c.manualRiskEnabled)}</div>
          ${moneyInput("manualRiskValue","Margem de risco manual",c.manualRiskValue)}
        </div></details>
        <details><summary>7. Imagens comprimidas</summary><div class="details-body">
          <div class="field"><label>Adicionar imagens (máximo 5)</label><input id="candidateImages" type="file" accept="image/*" multiple><div class="help">Redimensionadas para até 1280 px e salvas em JPEG local.</div></div>
          <div class="image-grid" id="candidateImagePreview">${renderImageTiles(c.images)}</div>
        </div></details>
        <details><summary>8. Observações</summary><div class="details-body"><textarea name="notes" placeholder="Observações livres">${escapeHtml(c.notes)}</textarea></div></details>
      </form>`;
      openModal(existing ? `Editar ${candidateName(c)}` : "Novo anúncio", body, `<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="saveCandidateBtn">SALVAR ANÚNCIO</button>`, {wide:true});
      let workingImages = [...(c.images || [])];
      byId("extractAdBtn").addEventListener("click", () => {
        const extracted = extractAdData(byId("adText").value);
        const form = byId("candidateForm");
        if (extracted.price && !form.askingPrice.value) form.askingPrice.value = extracted.price;
        ["yearMake","yearModel","mileage","motor","valves"].forEach(key => { if (extracted[key] && !form[key].value) form[key].value = extracted[key]; });
        if (extracted.defects) form.declaredDefects.value = [form.declaredDefects.value, extracted.defects].filter(Boolean).join("\n");
        if (extracted.inconsistencies) form.inconsistencies.value = [form.inconsistencies.value, extracted.inconsistencies].filter(Boolean).join("\n");
        toast("Extração local concluída. Revise todos os campos.", "success");
      });
      byId("candidateImages").addEventListener("change", async event => {
        const files = [...event.target.files].slice(0, Math.max(0, 5-workingImages.length));
        if (!files.length) return;
        toast("Comprimindo imagens localmente...");
        for (const file of files) {
          try { workingImages.push(await compressImage(file)); } catch (_) { toast(`Falha ao processar ${file.name}.`, "error"); }
        }
        byId("candidateImagePreview").innerHTML = renderImageTiles(workingImages);
        bindImageRemoval();
        toast("Imagens comprimidas.", "success");
      });
      function bindImageRemoval() { byId("candidateImagePreview").querySelectorAll("[data-image-id]").forEach(button => button.onclick = () => { workingImages = workingImages.filter(image => image.id !== button.dataset.imageId); byId("candidateImagePreview").innerHTML = renderImageTiles(workingImages); bindImageRemoval(); }); }
      bindImageRemoval();
      byId("saveCandidateBtn").addEventListener("click", () => {
        const form = byId("candidateForm"); if (!validateForm(form)) return;
        const data = getFormData(form);
        const numeric = ["yearMake","yearModel","mileage","askingPrice","negotiatedPrice","fipe","distance","contradictions","batteryVoltage","transportCost","documentCost","debts","transferCost","initialInsurance","manualRiskValue"];
        numeric.forEach(key => data[key] = data[key] === "" ? "" : nonNegative(data[key]));
        data.images = workingImages; data.createdAt = existing?.createdAt || new Date().toISOString(); data.compare = existing?.compare || false;
        const index = state.candidates.findIndex(item => item.id === data.id);
        if (index >= 0) state.candidates[index] = { ...existing, ...data }; else state.candidates.unshift(data);
        logDecision(existing ? "Candidato atualizado" : "Candidato cadastrado", candidateName(data), "", "Dados informados pelo usuário", money(data.askingPrice));
        closeModal(); scheduleSave(true); render(); toast("Anúncio salvo.", "success");
      });
    }

    function checkbox(name, label, checked) { return `<div class="checkline"><input type="checkbox" name="${name}" id="${name}" ${checked ? "checked" : ""}><label for="${name}">${escapeHtml(label)}</label></div>`; }
    function moneyInput(name, label, value) { return `<div class="field"><label>${escapeHtml(label)} (R$)</label><input type="number" min="0" step="0.01" name="${name}" value="${attr(value)}"></div>`; }
    function renderImageTiles(images = []) { return images.map(image => `<div class="image-tile"><img src="${image.data}" alt="${attr(image.name || "Imagem")}"><button type="button" data-image-id="${image.id}" aria-label="Remover imagem">×</button></div>`).join(""); }

    function openCandidateDetail(id) {
      const c = findCandidate(id); if (!c) return;
      const cost = calculateAcquisitionCost(c); const risk = calculateRisk(c); const inspection = calculateInspection(id); const reliability = calculateAdReliability(c); const offers = calculateOffers(c);
      const missingQuestions = [];
      if (!c.mileage) missingQuestions.push("Qual é a quilometragem atual e há comprovação?");
      if (!c.sellerName || c.ownerUnknown) missingQuestions.push("Quem é o proprietário legal e quem assinará a transferência?");
      if (!c.historyKnown) missingQuestions.push("Há histórico de manutenção, notas ou datas dos principais serviços?");
      if (!c.docRegular) missingQuestions.push("Existem débitos, restrições, divergências de chassi/motor, leilão ou sinistro?");
      if (c.testDrive !== "SIM") missingQuestions.push("Será permitido ligar com motor frio e realizar teste de rodagem?");
      if (c.refusesInspection) missingQuestions.push("Por que a vistoria/inspeção foi recusada?");
      const repairs = candidateRepairs(id);
      const body = `<div class="grid two">
        <article class="card"><h3>Resumo</h3><p><strong>${escapeHtml(candidateName(c))}</strong><br>${escapeHtml(c.city || "Local não informado")} · ${c.distance ? `${number(c.distance,0)} km` : "distância não informada"}</p><div class="chips">${badge(recommendation(c),statusColor(recommendation(c)))}${badge(documentStatus(c),statusColor(documentStatus(c)))}<span class="chip">Anúncio ${reliability.score}/100</span></div>${c.link ? `<p><a href="${attr(c.link)}" target="_blank" rel="noopener">Abrir link do anúncio</a></p>` : ""}</article>
        <article class="card"><h3>Custo total</h3><div class="score">${money(cost.total)}</div><small>Custo econômico ${money(cost.economicTotal)}</small><div class="comparison-value"><strong>Preço</strong>${money(cost.price)}</div><div class="comparison-value"><strong>Reparos imediatos</strong>${money(cost.immediateRepairs)}</div><div class="comparison-value"><strong>Risco</strong>${money(cost.risk)}</div></article>
      </div>
      <details open><summary>Confiabilidade e risco</summary><div class="details-body"><p><strong>Margem de risco:</strong> ${money(risk.value)} (${risk.points} pontos)</p><ul>${risk.reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>${reliability.alerts.length ? `<p><strong>Sinais do anúncio:</strong></p><ul>${reliability.alerts.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : "<p>Nenhum sinal adicional marcado.</p>"}</div></details>
      <details><summary>Perguntas antes da visita</summary><div class="details-body">${missingQuestions.length ? `<ol>${missingQuestions.map(question => `<li>${escapeHtml(question)}</li>`).join("")}</ol>` : `<p>Os principais campos estão preenchidos. Confirme novamente documentação e condição no dia.</p>`}</div></details>
      <details><summary>Inspeção técnica</summary><div class="details-body"><p>Nota ponderada: <strong>${inspection.verified ? `${number(inspection.score,2)}/5` : "Não iniciada"}</strong> · ${inspection.verified}/${inspection.total} verificados · ${inspection.unverified} não verificados.</p><button class="btn block" data-action="inspection" data-id="${c.id}">${inspection.verified ? "CONTINUAR INSPEÇÃO" : "INICIAR INSPEÇÃO"}</button></div></details>
      <details open><summary>Reparos identificados (${repairs.length})</summary><div class="details-body">${repairs.length ? repairs.map(r => `<div class="list-item"><strong>${escapeHtml(r.title)}</strong><br><small>${r.priority} · ${r.timing} · ${money(calculateRepairExpected(r))}</small></div>`).join("") : `<p class="muted">Nenhum reparo associado.</p>`}<button class="btn block section" id="addCandidateRepairBtn">ADICIONAR REPARO</button></div></details>
      <details><summary>Ofertas calculadas</summary><div class="details-body"><p>Agressiva: <strong>${offers.aggressive === null ? "A pesquisar" : money(offers.aggressive)}</strong><br>Justa: <strong>${offers.fair === null ? "A pesquisar" : money(offers.fair)}</strong><br>Limite máximo: <strong>${offers.maximum === null ? "A pesquisar" : money(offers.maximum)}</strong></p><small>${escapeHtml(offers.basis)}</small></div></details>
      ${c.images?.length ? `<details><summary>Imagens (${c.images.length})</summary><div class="details-body image-grid">${c.images.map(image=>`<div class="image-tile"><img src="${image.data}" alt="Imagem"></div>`).join("")}</div></details>` : ""}`;
      const canBuy = documentStatus(c) === "CONFIRMADA" && c.docCheckedToday && c.runs && c.testDrive === "SIM";
      openModal(candidateName(c), body, `<button class="btn" id="editCandidateBtn">EDITAR</button><button class="btn warning" id="buyCandidateBtn" ${canBuy ? "" : "disabled"}>COMPRAR</button><button class="btn" data-action="close-modal">FECHAR</button>`, {wide:true});
      byId("editCandidateBtn").onclick = () => openCandidateForm(c.id);
      byId("addCandidateRepairBtn").onclick = () => openRepairForm(null, c.id);
      byId("buyCandidateBtn").onclick = () => openPurchase(c.id);
    }

    function deleteCandidate(id) {
      const c = findCandidate(id); if (!c || !confirmAction(`Excluir ${candidateName(c)} e sua inspeção? Esta ação não pode ser desfeita.`)) return;
      state.candidates = state.candidates.filter(item => item.id !== id); state.inspections = state.inspections.filter(item => item.candidateId !== id); state.repairs = state.repairs.filter(item => item.candidateId !== id);
      logDecision("Candidato excluído", candidateName(c), "Manter histórico", "Exclusão confirmada pelo usuário", money(c.askingPrice)); scheduleSave(true); render(); toast("Candidato excluído.", "success");
    }

    function toggleCompare(id, checked) {
      const candidate = findCandidate(id); if (!candidate) return;
      if (checked && state.candidates.filter(item => item.compare).length >= 3) { candidate.compare = false; render(); toast("Selecione no máximo 3 candidatos.", "error"); return; }
      candidate.compare = checked; scheduleSave();
    }

    function openComparison() {
      const selected = state.candidates.filter(item => item.compare);
      if (!selected.length) { toast("Selecione até 3 candidatos nos cards."); return; }
      const body = `<div class="compare-grid">${selected.map(c => { const cost=calculateAcquisitionCost(c), ins=calculateInspection(c.id), rel=calculateAdReliability(c); return `<article class="card"><h3>${escapeHtml(candidateName(c))}</h3>${comparisonRow("Preço",money(c.askingPrice))}${comparisonRow("Transporte",money(c.transportCost))}${comparisonRow("Documentação",money(nonNegative(c.documentCost)+nonNegative(c.debts)+nonNegative(c.transferCost)))}${comparisonRow("Reparos imediatos",money(cost.immediateRepairs))}${comparisonRow("Risco",money(cost.risk))}${comparisonRow("Custo total",money(cost.total))}${comparisonRow("Nota técnica",ins.verified?`${number(ins.score,2)}/5`:"Não avaliada")}${comparisonRow("Quilometragem",c.mileage?`${number(c.mileage,0)} km`:"Não informada")}${comparisonRow("Versão/motor",`${c.version||"—"} ${c.motor||""}`)}${comparisonRow("Anúncio",`${rel.score}/100`)}${comparisonRow("Documentação",documentStatus(c))}${comparisonRow("Recomendação",recommendation(c))}</article>`; }).join("")}</div>`;
      openModal(`Comparação de ${selected.length} candidato(s)`, body, `<button class="btn" onclick="window.print()">IMPRIMIR / PDF</button><button class="btn" data-action="close-modal">FECHAR</button>`, {wide:true});
    }
    function comparisonRow(label,value) { return `<div class="comparison-value"><strong>${escapeHtml(label)}</strong>${escapeHtml(value)}</div>`; }

    function openOffers(id) {
      const c=findCandidate(id); if(!c)return; const offers=calculateOffers(c);
      openModal(`Ofertas — ${candidateName(c)}`, `<div class="grid three"><div class="card metric"><span class="label">Oferta agressiva</span><span class="value">${offers.aggressive===null?"A pesquisar":money(offers.aggressive)}</span></div><div class="card metric"><span class="label">Oferta justa</span><span class="value">${offers.fair===null?"A pesquisar":money(offers.fair)}</span></div><div class="card metric"><span class="label">Limite máximo</span><span class="value">${offers.maximum===null?"A pesquisar":money(offers.maximum)}</span></div></div><p class="section">${escapeHtml(offers.basis)}</p><p class="muted">FIPE é somente o valor digitado pelo usuário. Sem dados suficientes, o sistema não inventa referências.</p>`, `<button class="btn" data-action="close-modal">FECHAR</button>`);
    }

    // ===========================
    // INSPECTION
    // ===========================
    function ensureInspection(candidateId) {
      let inspection = state.inspections.find(item => item.candidateId === candidateId);
      if (!inspection) { inspection = { id: uid(), candidateId, mode: "STEP", current: 0, paused: false, pauseReason: "", items: {}, updatedAt: new Date().toISOString() }; state.inspections.push(inspection); }
      return inspection;
    }

    function flatInspectionItems() { return INSPECTION_DEFINITION.flatMap(category => category.items.map((label,index) => ({ key:`${category.id}-${index}`, category:category.label, label }))); }

    function openInspection(candidateId) {
      const candidate=findCandidate(candidateId); if(!candidate)return; const inspection=ensureInspection(candidateId); renderInspectionModal(candidate,inspection);
    }

    function renderInspectionModal(candidate, inspection) {
      const flat=flatInspectionItems(); inspection.current=clamp(inspection.current||0,0,flat.length-1); const calc=calculateInspection(candidate.id); const step=flat[inspection.current];
      const header=`<div class="card"><div class="list-item-head"><div><strong>${calc.verified}/${calc.total} verificados</strong><br><small>${calc.unverified} não verificados · nota ${calc.verified?number(calc.score,2):"—"}</small></div>${badge(inspection.mode==="STEP"?"PASSO A PASSO":"LISTA","blue")}</div><div class="progress section"><span style="width:${calc.total?calc.verified/calc.total*100:0}%"></span></div></div><div class="button-row section"><button class="btn small" id="stepModeBtn">PASSO A PASSO</button><button class="btn small" id="listModeBtn">LISTA</button><button class="btn small warning" id="pauseInspectionBtn">PAUSAR</button></div>`;
      let content="";
      if(inspection.mode==="STEP") content=`<div class="section"><div class="eyebrow">${inspection.current+1} de ${flat.length} · ${escapeHtml(step.category)}</div>${renderInspectionInput(step,inspection.items[step.key])}<div class="button-row"><button class="btn" id="previousInspectionBtn" ${inspection.current===0?"disabled":""}>ANTERIOR</button><button class="btn primary" id="nextInspectionBtn">${inspection.current===flat.length-1?"CONCLUIR":"PRÓXIMO"}</button></div></div>`;
      else content=`<div class="section">${INSPECTION_DEFINITION.map(category=>`<details open><summary>${category.label}</summary><div class="details-body">${category.items.map((label,index)=>renderInspectionInput({key:`${category.id}-${index}`,category:category.label,label},inspection.items[`${category.id}-${index}`],true)).join("")}</div></details>`).join("")}</div>`;
      openModal(`Inspeção — ${candidateName(candidate)}`, header+content, `<button class="btn" data-action="close-modal">FECHAR E CONTINUAR DEPOIS</button>`, {wide:true});
      byId("stepModeBtn").onclick=()=>{inspection.mode="STEP";scheduleSave();renderInspectionModal(candidate,inspection);};
      byId("listModeBtn").onclick=()=>{inspection.mode="LIST";scheduleSave();renderInspectionModal(candidate,inspection);};
      byId("pauseInspectionBtn").onclick=()=>openPauseInspection(candidate,inspection);
      document.querySelectorAll(".inspection-item").forEach(container=>bindInspectionItem(container,inspection,candidate));
      if(byId("previousInspectionBtn")) byId("previousInspectionBtn").onclick=()=>{inspection.current=Math.max(0,inspection.current-1);scheduleSave();renderInspectionModal(candidate,inspection);};
      if(byId("nextInspectionBtn")) byId("nextInspectionBtn").onclick=()=>{if(inspection.current<flat.length-1)inspection.current++;else toast("Inspeção concluída com os itens verificados. Não verificados permanecem como risco.","success");scheduleSave(true);renderInspectionModal(candidate,inspection);};
    }

    function renderInspectionInput(definition,item={},compact=false) {
      const value=item||{}; return `<div class="inspection-item ${value.verified?"":"unverified"}" data-key="${definition.key}"><div class="list-item-head"><div><strong>${escapeHtml(definition.label)}</strong><br><small>${escapeHtml(definition.category)}</small></div><span class="badge ${value.verified?"green":"yellow"}">${value.verified?`NOTA ${value.score}`:"NÃO VERIFICADO"}</span></div><div class="score-buttons">${[0,1,2,3,4,5].map(score=>`<button type="button" data-score="${score}" class="${value.verified&&safeNumber(value.score)===score?"selected":""}">${score}</button>`).join("")}</div><div class="field"><label>Observação</label><textarea class="inspection-note" rows="${compact?2:3}" placeholder="Evidências, ruídos, vazamentos, testes...">${escapeHtml(value.note||"")}</textarea></div><div class="checkline"><input type="checkbox" class="inspection-unverified" ${value.verified?"":"checked"}><label>Não verificado</label></div></div>`;
    }

    function bindInspectionItem(container,inspection,candidate) {
      const key=container.dataset.key; const ensure=()=>inspection.items[key]||(inspection.items[key]={verified:false,score:null,note:""});

      container.querySelector(".inspection-unverified").onchange=event=>{const item=ensure();item.verified=!event.target.checked;if(!item.verified)item.score=null;inspection.updatedAt=new Date().toISOString();scheduleSave();renderInspectionModal(candidate,inspection);};
      container.querySelector(".inspection-note").oninput=event=>{const item=ensure();item.note=event.target.value;inspection.updatedAt=new Date().toISOString();scheduleSave();};
    }

    function openPauseInspection(candidate,inspection) {
      const body=`<form id="pauseForm"><div class="field"><label>Motivo da pausa</label><select name="reason">${selectOptions(["Falta de tempo","Teste não autorizado","Item inacessível","Outro"],inspection.pauseReason)}</select></div><div class="field"><label>Observação</label><textarea name="note">${escapeHtml(inspection.pauseNote||"")}</textarea></div></form>`;

    }

    // ===========================
    // FINANCE
    // ===========================
    function openFinance() {
      const projection=projectReserve(); const sim=state.finance.loanSimulation?amortizationComparison(state.finance.loanSimulation):null;
      const body=`<form id="financeSettingsForm" class="card"><h3>Disponibilidade atual</h3><div class="form-grid">${moneyInput("currentReserve","Reserva disponível hoje",state.finance.currentReserve)}${moneyInput("maxInstallment","Parcela máxima desejada",state.settings.maxInstallment)}</div><button type="button" class="btn block" id="saveFinanceSettingsBtn">SALVAR VALORES</button></form>
      <section class="section"><div class="section-head"><h3>Aportes</h3><button class="btn small primary" id="newContributionBtn">NOVO APORTE</button></div>${state.contributions.length?`<div class="list">${state.contributions.sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(item=>`<div class="list-item"><div class="list-item-head"><div><strong>${escapeHtml(item.description||item.status)}</strong><br><small>${dateLabel(item.date)} · ${item.status}</small></div><span>${item.min===item.max?money(item.min):`${money(item.min)}–${money(item.max)}`}</span></div><div class="list-actions"><button class="btn small" data-contribution-edit="${item.id}">EDITAR</button><button class="btn small danger" data-contribution-delete="${item.id}">EXCLUIR</button></div></div>`).join("")}</div>`:emptyState("Nenhum aporte.","Cadastre aportes garantidos ou prováveis.")}</section>
      <details open><summary>Projeção de 12 meses</summary><div class="details-body table-wrap"><table><thead><tr><th>Mês</th><th>Conservador</th><th>Otimista</th></tr></thead><tbody>${projection.map(row=>`<tr><td>${monthLabel(row.date)}</td><td>${money(row.conservative)}</td><td>${money(row.optimistic)}</td></tr>`).join("")}</tbody></table></div></details>
      <details open><summary>Consignado / financiamento</summary><div class="details-body"><form id="loanForm" class="form-grid">
        ${moneyInput("principal","Valor financiado",state.finance.loanSimulation?.principal||0)}
        <div class="field"><label>Taxa mensal (%)</label><input type="number" min="0" step="0.001" name="rate" value="${attr(state.finance.loanSimulation?.rate||"")}" placeholder="Informe a taxa real"></div>
        <div class="field"><label>Número de parcelas</label><input type="number" min="1" name="periods" value="${attr(state.finance.loanSimulation?.periods||"")}"></div>
        ${moneyInput("fees","Tarifas",state.finance.loanSimulation?.fees||0)}
        ${moneyInput("insurance","Seguros do crédito",state.finance.loanSimulation?.insurance||0)}
        ${moneyInput("extraPayment","Aporte para amortização",state.finance.loanSimulation?.extraPayment||0)}
        <div class="field"><label>Amortizar após parcela</label><input type="number" min="1" name="extraAfter" value="${attr(state.finance.loanSimulation?.extraAfter||1)}"></div>
        <button type="button" class="btn primary wide" id="simulateLoanBtn">SIMULAR</button>
      </form>${sim?renderLoanResult(sim):`<p class="muted">Informe taxa e prazo reais. O sistema não sugere taxa.</p>`}</div></details>
      <div class="grid two"><div class="card metric"><span class="label">Compra máxima à vista</span><span class="value">${money(safePurchaseMaximum())}</span></div><div class="card metric"><span class="label">Compra máxima com crédito</span><span class="value">${sim?money(safePurchaseMaximum()+sim.base.principal):"A calcular"}</span></div></div>`;
      openModal("Finanças para aquisição",body,`<button class="btn" data-action="close-modal">FECHAR</button>`,{wide:true});
      byId("saveFinanceSettingsBtn").onclick=()=>{const data=getFormData(byId("financeSettingsForm"));state.finance.currentReserve=nonNegative(data.currentReserve);state.settings.maxInstallment=nonNegative(data.maxInstallment);scheduleSave();openFinance();toast("Valores financeiros salvos.","success");};
      byId("newContributionBtn").onclick=()=>openContributionForm();
      document.querySelectorAll("[data-contribution-edit]").forEach(btn=>btn.onclick=()=>openContributionForm(btn.dataset.contributionEdit));
      document.querySelectorAll("[data-contribution-delete]").forEach(btn=>btn.onclick=()=>{if(!confirmAction("Excluir este aporte?"))return;state.contributions=state.contributions.filter(x=>x.id!==btn.dataset.contributionDelete);scheduleSave();openFinance();});
      byId("simulateLoanBtn").onclick=()=>{const form=byId("loanForm");if(!validateForm(form))return;const data=getFormData(form);["principal","rate","periods","fees","insurance","extraPayment","extraAfter"].forEach(k=>data[k]=nonNegative(data[k]));state.finance.loanSimulation=data;const result=amortizationComparison(data);if(result.base.installment>nonNegative(state.settings.maxInstallment)){const justification=prompt(`A parcela de ${money(result.base.installment)} supera o limite de ${money(state.settings.maxInstallment)}. Se desejar manter a simulação, registre uma justificativa:`);if(justification){logDecision("Alerta de parcela ignorado","Simulação de consignado","Reduzir valor ou aumentar prazo",justification,`Parcela ${money(result.base.installment)}`);state.finance.ignoredAlerts.push({id:uid(),date:new Date().toISOString(),type:"PARCELA",justification,values:result.base});}}scheduleSave(true);openFinance();};
    }

    function renderLoanResult(sim) {
      const best=sim.savingTerm>=sim.savingPayment?"REDUZIR PRAZO":"REDUZIR PARCELA";
      return `<div class="section"><div class="grid three"><div class="card"><strong>Até o final</strong><br>Parcela ${money(sim.base.installment)}<br>Total ${money(sim.base.total)}<br>Juros ${money(sim.base.interest)}</div><div class="card"><strong>Reduzir prazo</strong><br>${sim.reduceTerm.periods} parcelas no total<br>Total ${money(sim.reduceTerm.total)}<br>Economia ${money(sim.savingTerm)}</div><div class="card"><strong>Reduzir parcela</strong><br>Nova parcela ${money(sim.reducePayment.installment)}<br>Total ${money(sim.reducePayment.total)}<br>Economia ${money(sim.savingPayment)}</div></div><p>${badge(`MAIOR ECONOMIA: ${best}`,"green")}</p>${sim.base.installment>nonNegative(state.settings.maxInstallment)?`<p class="danger-text"><strong>ALERTA:</strong> parcela acima do limite configurado de ${money(state.settings.maxInstallment)}.</p>`:""}</div>`;
    }

    function openContributionForm(id=null) {
      const item=state.contributions.find(x=>x.id===id)||{id:uid(),date:localDateISO(),status:"PROVÁVEL",min:0,max:0,description:""};
      openModal(id?"Editar aporte":"Novo aporte",`<form id="contributionForm"><input type="hidden" name="id" value="${item.id}"><div class="field"><label class="required">Descrição</label><input required name="description" value="${attr(item.description)}"></div><div class="form-grid"><div class="field"><label class="required">Data</label><input required type="date" name="date" value="${attr(item.date)}"></div><div class="field"><label>Status</label><select name="status">${selectOptions(["DISPONÍVEL","GARANTIDO","PROVÁVEL"],item.status)}</select></div>${moneyInput("min","Valor mínimo",item.min)}${moneyInput("max","Valor máximo",item.max)}</div></form>`,`<button class="btn" id="backFinanceBtn">CANCELAR</button><button class="btn primary" id="saveContributionBtn">SALVAR</button>`);
      byId("backFinanceBtn").onclick=openFinance;byId("saveContributionBtn").onclick=()=>{const form=byId("contributionForm");if(!validateForm(form))return;const data=getFormData(form);data.min=nonNegative(data.min);data.max=Math.max(data.min,nonNegative(data.max));const index=state.contributions.findIndex(x=>x.id===data.id);if(index>=0)state.contributions[index]=data;else state.contributions.push(data);scheduleSave();openFinance();};
    }

    function openInsurance() {
      const list=state.insuranceQuotes;
      const body=`<div class="list">${list.length?list.map(q=>`<div class="list-item"><div class="list-item-head"><div><strong>${escapeHtml(q.company||"Empresa não informada")}</strong><br><small>${escapeHtml(q.type)} · ${escapeHtml(q.coverage||"Cobertura não informada")}</small></div><strong>${money(q.annualPrice)}/ano</strong></div><small>Equivalente mensal ${money(nonNegative(q.annualPrice)/12)} · Franquia ${optionalMoney(q.deductible)}</small><div class="list-actions"><button class="btn small danger" data-quote-delete="${q.id}">EXCLUIR</button></div></div>`).join(""):emptyState("Nenhuma cotação.","Registre somente valores reais informados.")}</div><form id="insuranceForm" class="card section"><h3>Nova cotação</h3><div class="form-grid"><div class="field"><label>Tipo</label><select name="type">${selectOptions(["Seguro completo","Roubo/furto/terceiros","Terceiros","Proteção veicular"],"")}</select></div><div class="field"><label>Empresa</label><input name="company"></div><div class="field wide"><label>Cobertura</label><input name="coverage"></div>${moneyInput("annualPrice","Preço anual",0)}${moneyInput("deductible","Franquia",0)}<div class="field wide"><label>Observações</label><textarea name="notes"></textarea></div>${checkbox("purchased","Cotação contratada",false)}</div><button type="button" class="btn primary block" id="saveInsuranceBtn">SALVAR COTAÇÃO</button></form>`;
      openModal("Cotações de seguro",body,`<button class="btn" data-action="close-modal">FECHAR</button>`,{wide:true});
      byId("saveInsuranceBtn").onclick=()=>{const data=getFormData(byId("insuranceForm"));data.id=uid();data.annualPrice=nonNegative(data.annualPrice);data.deductible=nonNegative(data.deductible);state.insuranceQuotes.unshift(data);scheduleSave();openInsurance();};
      document.querySelectorAll("[data-quote-delete]").forEach(btn=>btn.onclick=()=>{if(confirmAction("Excluir cotação?")){state.insuranceQuotes=state.insuranceQuotes.filter(x=>x.id!==btn.dataset.quoteDelete);scheduleSave();openInsurance();}});
    }

    function openTools() {
      const body=`${state.tools.length?`<div class="list">${state.tools.map(t=>`<div class="list-item"><div class="list-item-head"><div><strong>${escapeHtml(t.name)}</strong><br><small>${escapeHtml(t.state||"Estado não informado")} · ${escapeHtml(t.location||"Local não informado")}</small></div><strong>${money(t.price)}</strong></div><small>Economia estimada gerada: ${money(t.savings)}</small><div class="list-actions"><button class="btn small danger" data-tool-delete="${t.id}">EXCLUIR</button></div></div>`).join("")}</div>`:emptyState("Nenhuma ferramenta.","Cadastre ferramentas adquiridas para o projeto.")}<form id="toolForm" class="card section"><h3>Nova ferramenta</h3><div class="form-grid"><div class="field"><label class="required">Nome</label><input required name="name"></div>${moneyInput("price","Preço",0)}<div class="field"><label>Estado</label><input name="state" placeholder="Nova, usada..."></div><div class="field"><label>Localização</label><input name="location"></div>${moneyInput("savings","Economia estimada gerada",0)}<div class="field"><label>Reparos em que foi usada</label><input name="repairsUsed"></div>${checkbox("vectraSpecific","Específica do Vectra",false)}</div><button type="button" class="btn primary block" id="saveToolBtn">SALVAR FERRAMENTA</button></form>`;
      openModal("Ferramentas",body,`<button class="btn" data-action="close-modal">FECHAR</button>`,{wide:true});
      byId("saveToolBtn").onclick=()=>{const form=byId("toolForm");if(!validateForm(form))return;const data=getFormData(form);data.id=uid();data.price=nonNegative(data.price);data.savings=nonNegative(data.savings);state.tools.unshift(data);scheduleSave();openTools();};
      document.querySelectorAll("[data-tool-delete]").forEach(btn=>btn.onclick=()=>{if(confirmAction("Excluir ferramenta?")){state.tools=state.tools.filter(x=>x.id!==btn.dataset.toolDelete);scheduleSave();openTools();}});
    }

    function openPurchase(candidateId) {
      const c=findCandidate(candidateId);if(!c||!ensurePurchaseEligible(c))return;const cost=calculateAcquisitionCost(c);
      const body=`<div class="card attention"><strong>Verificação eliminatória concluída</strong><p>Confirme novamente os dados da transação. A compra converterá o candidato em cadastro oficial e mudará a fase para REFORMA.</p></div><form id="purchaseForm" class="section"><div class="form-grid">${moneyInput("finalPrice","Valor final",c.negotiatedPrice||c.askingPrice)}<div class="field"><label class="required">Forma de pagamento</label><input required name="paymentMethod"></div><div class="field"><label class="required">Quem recebeu</label><input required name="recipient"></div><div class="field"><label>Comprovante / referência</label><input name="proof"></div><div class="field"><label>Recibo / contrato</label><input name="contract"></div><div class="field"><label>Transferência planejada</label><input type="date" name="transferPlanned"></div><div class="field"><label>Data da compra</label><input type="date" name="purchaseDate" value="${localDateISO()}"></div><div class="field"><label>Quilometragem na compra</label><input type="number" min="0" name="purchaseKm" value="${attr(c.mileage)}"></div><div class="field wide"><label>Motivos da compra / condições negociadas</label><textarea name="reason"></textarea></div></div><div class="grid two"><div class="card metric"><span class="label">Custo de aquisição estimado</span><span class="value">${money(cost.total)}</span></div><div class="card metric"><span class="label">Reserva restante estimada</span><span class="value">${money(nonNegative(state.finance.currentReserve)-nonNegative(c.negotiatedPrice||c.askingPrice))}</span></div></div></form>`;
      openModal(`Confirmar compra — ${candidateName(c)}`,body,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn success" id="confirmPurchaseBtn">CONFIRMAR COMPRA</button>`,{wide:true});
      byId("confirmPurchaseBtn").onclick=()=>{const form=byId("purchaseForm");if(!validateForm(form)||!confirmAction("Confirmar a compra e iniciar a fase REFORMA?"))return;const data=getFormData(form);data.finalPrice=nonNegative(data.finalPrice);data.purchaseKm=nonNegative(data.purchaseKm);const finalCost=calculateAcquisitionCost(c,data.finalPrice);state.vehicle={...c,...data,candidateId:c.id,id:uid(),currentKm:data.purchaseKm,acquisitionTotal:finalCost.total,purchaseSnapshot:JSON.parse(JSON.stringify(c)),purchasedAt:new Date().toISOString()};state.settings.phase="REFORMA";state.finance.currentReserve=Math.max(0,nonNegative(state.finance.currentReserve)-data.finalPrice);state.repairs.forEach(r=>{if(r.candidateId===c.id){delete r.candidateId;r.vehicleId=state.vehicle.id;}});state.documents.push({id:uid(),type:"Transferência",status:"PENDENTE",dueDate:data.transferPlanned,notes:"Acompanhar ATPV-e/recibo, vistoria, taxas e conclusão."});logDecision("Compra confirmada",candidateName(c),"Não comprar",data.reason,`Valor final ${money(data.finalPrice)}; custo total ${money(finalCost.total)}`);state.meta.importantChange=true;scheduleSave(true);closeModal();navigate("home");toast("Compra registrada. Fase REFORMA iniciada.","success");};
    }

    // ===========================
    // REPAIRS
    // ===========================
    function renderRepairs() {
      if(!state.vehicle&&!state.repairs.some(r=>r.candidateId))return `<div class="page-title"><div><div class="eyebrow">Fase posterior</div><h1>Reforma</h1></div></div>${emptyState("Nenhum Vectra adquirido.","Este módulo será ativado após a compra. Reparos de candidatos são gerenciados dentro de cada candidato.")}`;
      const list=state.repairs.filter(r=>!r.candidateId).sort((a,b)=>(PRIORITY_ORDER[a.priority]||9)-(PRIORITY_ORDER[b.priority]||9));const progress=calculateRepairProgress();const next=recommendedRepair();
      return `<div class="page-title"><div><div class="eyebrow">Segurança → confiabilidade → conforto → estética</div><h1>Reforma</h1><p class="muted">${list.filter(r=>r.status!=="RESOLVIDO").length} pendente(s)</p></div><button class="btn primary small" data-action="new-repair">NOVO</button></div>${next?`<article class="card accent"><div class="eyebrow">Recomendação atual</div><h2>${escapeHtml(next.title)}</h2><p>${next.priority} · criticidade ${nonNegative(next.severity)}/5 · necessário ${money(calculateRepairExpected(next))} · disponível ${money(state.finance.currentReserve)}</p><button class="btn primary block" data-action="edit-repair" data-id="${next.id}">ABRIR REPARO</button></article>`:""}<section class="section grid two">${Object.entries(progress).map(([k,v])=>`<div class="card"><div class="list-item-head"><strong>${k}</strong><span>${number(v.percent,0)}%</span></div><div class="progress"><span style="width:${v.percent}%"></span></div><small>${v.complete}/${v.total} · restante ${money(v.remaining)}</small></div>`).join("")}</section><section class="section"><div class="list">${list.length?list.map(renderRepairCard).join(""):emptyState("Nenhum reparo cadastrado.","Cadastre problemas, custos, testes e prioridades.",`<button class="btn primary" data-action="new-repair">NOVO REPARO</button>`)}</div></section>`;
    }

    function renderRepairCard(r) { return `<article class="card ${r.priority==="SEGURANÇA"?"critical":""}"><div class="list-item-head"><div><h3>${escapeHtml(r.title)}</h3><small>${escapeHtml(r.system||"Sistema não informado")} · ${r.timing||"Prazo não informado"}</small></div>${badge(r.status||"PLANEJADO",statusColor(r.status))}</div><div class="chips"><span class="chip">${r.priority}</span><span class="chip">Previsto ${money(calculateRepairExpected(r))}</span><span class="chip">Econômico ${money(calculateRepairEconomic(r))}</span><span class="chip">Economia mão de obra ${money(nonNegative(r.ownHours) * nonNegative(state.settings.ownHourValue))}</span><span class="chip">Criticidade ${nonNegative(r.severity)}/5</span></div><div class="list-actions"><button class="btn small" data-action="edit-repair" data-id="${r.id}">EDITAR</button><button class="btn small success" data-action="complete-repair" data-id="${r.id}">CONCLUIR</button>${r.status==="RESOLVIDO"?`<button class="btn small warning" data-action="recur-repair" data-id="${r.id}">REINCIDIU</button>`:""}<button class="btn small danger" data-action="delete-repair" data-id="${r.id}">EXCLUIR</button></div></article>`; }

    function openRepairForm(id=null,candidateId=null) {
      const existing=id?findRepair(id):null;const r={id:uid(),candidateId:candidateId||"",title:"",system:"",description:"",priority:"CONFIABILIDADE",necessary:true,timing:"CURTO PRAZO",parts:"",materials:"",tools:"",ownHours:0,thirdParty:"",duration:"",estimatedCost:0,partsCost:0,materialsCost:0,toolCost:0,thirdPartyCost:0,actualCost:0,status:"PLANEJADO",severity:3,reincidences:0,...(existing||{})};

stimatedCost)}${moneyInput("partsCost","Peças",r.partsCost)}${moneyInput("materialsCost","Materiais",r.materialsCost)}${moneyInput("toolCost","Ferramentas específicas",r.toolCost)}${moneyInput("thirdPartyCost","Terceiros",r.thirdPartyCost)}</div></form>`;
      openModal(existing?"Editar reparo":"Novo reparo",body,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="saveRepairBtn">SALVAR</button>`,{wide:true});
      byId("saveRepairBtn").onclick=()=>{const form=byId("repairForm");if(!validateForm(form))return;const data=getFormData(form);["severity","ownHours","estimatedCost","partsCost","materialsCost","toolCost","thirdPartyCost"].forEach(k=>data[k]=nonNegative(data[k]));data.actualCost=existing?.actualCost||0;data.reincidences=existing?.reincidences||0;const index=state.repairs.findIndex(x=>x.id===data.id);if(index>=0)state.repairs[index]={...existing,...data};else state.repairs.unshift(data);if(existing&&existing.priority!==data.priority)logDecision("Prioridade de reparo alterada",data.title,existing.priority,"Alteração realizada no formulário",data.priority);scheduleSave(true);if(candidateId){closeModal();openCandidateDetail(candidateId);}else{closeModal();navigate("repairs");}toast("Reparo salvo.","success");};
    }

    function openCompleteRepair(id) {

    function renderRecords() {

      return `<div class="page-title"><div><div class="eyebrow">Operação e confiabilidade</div><h1>Registros</h1><p class="muted">Abastecimentos, manutenção, falhas, sintomas, serviços e despesas.</p></div></div><button class="btn primary block" data-action="new-record">＋ NOVO REGISTRO</button>
      <section class="section grid three"><div class="card metric"><span class="label">Consumo cheio a cheio</span><span class="value">${lastFuel?.consumption?`${number(lastFuel.consumption,2)} km/l`:"A calcular"}</span><span class="sub">Exige dois abastecimentos completos</span></div><div class="card metric"><span class="label">Falhas / sintomas abertos</span><span class="value">${state.failures.filter(x=>x.status!=="ENCERRADO").length}</span></div><div class="card metric"><span class="label">FMEA de alta prioridade</span><span class="value">${state.fmea.filter(x=>calculateFmea(x).band==="ALTO").length}</span></div></section>
      <section class="section"><div class="chips no-print">${["TODOS","ABASTECIMENTO","MANUTENÇÃO","FALHA","QUASE-FALHA","SINTOMA","SERVIÇO","DESPESA"].map(type=>`<button class="btn small ${currentRecordFilter===type?"primary":""}" data-record-filter="${type}">${type}</button>`).join("")}</div></section>
      <section class="section"><div class="list">${records.length?records.map(record=>`<article class="list-item"><div class="list-item-head"><div><h3>${escapeHtml(record.title||record.type)}</h3><small>${dateLabel(record.date)} · ${record.km?`${number(record.km,0)} km`:"km não informado"}</small></div>${badge(record.type,record.type==="FALHA"?"red":record.type==="SINTOMA"?"yellow":"blue")}</div><p>${escapeHtml(truncate(record.description||record.notes||"Sem descrição",140))}</p><div class="chips">${record.cost?`<span class="chip">${money(record.cost)}</span>`:""}${record.total?`<span class="chip">${money(record.total)}</span>`:""}</div><div class="list-actions"><button class="btn small" data-action="record-detail" data-id="${record.id}">ABRIR</button><button class="btn small danger" data-action="delete-record" data-id="${record.id}">EXCLUIR</button></div></article>`).join(""):emptyState("Nenhum registro neste filtro.","Use NOVO REGISTRO para começar.")}</div></section>
      <section class="section"><details><summary>Controles especiais</summary><div class="details-body grid two"><button class="btn" id="oilLogBtn">ÓLEO DO MOTOR</button><button class="btn" id="fluidLogBtn">FLUIDOS</button><button class="btn" id="beltLogBtn">CORREIA DENTADA</button><button class="btn" id="serviceLogBtn">SERVIÇO TERCEIRIZADO</button><button class="btn" id="documentLogBtn">DOCUMENTOS</button><button class="btn" id="patrimonialLogBtn">VALOR PATRIMONIAL</button><button class="btn" id="gnvSimulatorBtn">SIMULADOR GNV</button></div></details></section>`;
    }

    document.addEventListener("click",event=>{

    function openRecordForm() {
      openModal("Novo registro",`<p>Escolha o tipo. Cada fluxo registra somente dados informados por você.</p><div class="grid two">${["ABASTECIMENTO","MANUTENÇÃO","FALHA","QUASE-FALHA","SINTOMA","SERVIÇO","DESPESA"].map(type=>`<button class="btn" data-new-record-type="${type}">${type}</button>`).join("")}</div>`,`<button class="btn" data-action="close-modal">CANCELAR</button>`);

    }

    function openGenericRecordForm(type,record=null) {
      const r=record||{id:uid(),type,date:localDateISO(),km:state.vehicle?.currentKm||"",title:"",description:"",cost:0};
      openModal(`${record?"Editar":"Novo"} ${type.toLowerCase()}`,`<form id="genericRecordForm"><input type="hidden" name="id" value="${r.id}"><div class="form-grid"><div class="field"><label class="required">Data</label><input required type="date" name="date" value="${attr(r.date)}"></div><div class="field"><label>Quilometragem</label><input type="number" min="0" name="km" value="${attr(r.km)}"></div><div class="field wide"><label class="required">Título</label><input required name="title" value="${attr(r.title)}"></div><div class="field wide"><label>Descrição</label><textarea name="description">${escapeHtml(r.description)}</textarea></div>${moneyInput("cost","Custo",r.cost)}</div></form>`,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="saveGenericRecordBtn">SALVAR</button>`);
      byId("saveGenericRecordBtn").onclick=()=>{const form=byId("genericRecordForm");if(!validateForm(form))return;const data=getFormData(form);data.type=type;data.km=nonNegative(data.km);data.cost=nonNegative(data.cost);const index=state.records.findIndex(x=>x.id===data.id);if(index>=0)state.records[index]=data;else state.records.unshift(data);if(state.vehicle&&data.km>nonNegative(state.vehicle.currentKm))state.vehicle.currentKm=data.km;scheduleSave();closeModal();navigate("records");toast("Registro salvo.","success");};
    }

    function openFuelForm() {
      openModal("Novo abastecimento",`<form id="fuelForm"><div class="form-grid"><div class="field"><label class="required">Data</label><input required type="date" name="date" value="${localDateISO()}"></div><div class="field"><label class="required">Quilometragem</label><input required type="number" min="0" name="km" value="${attr(state.vehicle?.currentKm||"")}"></div><div class="field"><label>Posto</label><input name="station"></div><div class="field"><label>Combustível</label><input name="fuel" value="${attr(state.settings.defaultFuel)}"></div><div class="field"><label class="required">Litros</label><input required type="number" min="0.01" step="0.001" name="liters"></div><div class="field"><label class="required">Preço/litro</label><input required type="number" min="0" step="0.001" name="pricePerLiter"></div><div class="field"><label>Total informado</label><input type="number" min="0" step="0.01" name="total"></div>${checkbox("fullTank","Tanque cheio",true)}<div class="field"><label>Autonomia indicada (km)</label><input type="number" min="0" name="indicatedRange"></div><div class="field"><label>Capacidade considerada do tanque (l)</label><input type="number" min="0" step="0.1" name="tankCapacity"><div class="help">Informe manualmente conforme o veículo/medição.</div></div><div class="field"><label>Nível indicado</label><input name="indicatedLevel"></div><div class="field"><label>Qualidade percebida</label><select name="quality">${selectOptions(["NORMAL","SUSPEITA","PROBLEMA CONFIRMADO"],"NORMAL")}</select></div><div class="field wide"><label>Observações</label><textarea name="notes"></textarea></div></div></form>`,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="saveFuelBtn">SALVAR</button>`);
      byId("saveFuelBtn").onclick=()=>{const form=byId("fuelForm");if(!validateForm(form))return;const data=getFormData(form);["km","liters","pricePerLiter","total","indicatedRange","tankCapacity"].forEach(k=>data[k]=nonNegative(data[k]));if(!data.total)data.total=data.liters*data.pricePerLiter;data.id=uid();state.fuelLogs.push(data);state.records.unshift({id:uid(),type:"ABASTECIMENTO",date:data.date,km:data.km,title:`Abastecimento — ${data.fuel}`,description:`${number(data.liters,2)} l em ${escapeHtml(data.station||"posto não informado")}`,total:data.total,fuelLogId:data.id});if(state.vehicle&&data.km>nonNegative(state.vehicle.currentKm))state.vehicle.currentKm=data.km;if(data.quality==="SUSPEITA"){const failure={id:uid(),type:"SINTOMA",date:data.date,km:data.km,title:"Combustível com qualidade suspeita",description:`Abastecimento em ${data.station||"posto não informado"}; manter aberto até confirmação.`,status:"ABERTO",fuelLogId:data.id};state.failures.unshift(failure);state.records.unshift({id:uid(),type:"SINTOMA",date:data.date,km:data.km,title:failure.title,description:failure.description,failureId:failure.id});}scheduleSave(true);closeModal();navigate("records");const metric=calculateFuelMetrics().at(-1);if(metric?.difference>nonNegative(state.settings.autonomyAlertPercent))toast(`Alerta: autonomia indicada difere ${number(metric.difference,1)}% da real.`,"error");else toast("Abastecimento salvo.","success");};
    }

    function openFailureForm(existingId=null,type="SINTOMA") {
      const existing=existingId?state.failures.find(x=>x.id===existingId):null;const f={id:uid(),type,date:localDateISO(),km:state.vehicle?.currentKm||"",title:"",description:"",sequence:"",conditions:"",rain:"NÃO INFORMADO",ambientTemperature:"",road:"",traffic:"",load:"",systems:"",suspectedParts:"",hypotheses:"",tests:"",evidence:"",results:"",diagnosis:"",solution:"",status:"ABERTO",why1:"",why2:"",why3:"",why4:"",why5:"",causeCategory:"",rootCause:"",correctiveAction:"",preventiveAction:"",validation:"",cost:0,downtime:0,safetyRisk:"",useImpact:"",travelImpact:"",reliabilityImpact:"",prevention:"",...(existing||{})};

sts)}</textarea></div><div class="field"><label>Evidências</label><textarea name="evidence">${escapeHtml(f.evidence)}</textarea></div><div class="field"><label>Resultados</label><textarea name="results">${escapeHtml(f.results)}</textarea></div><div class="field"><label>Diagnóstico final</label><textarea name="diagnosis">${escapeHtml(f.diagnosis)}</textarea></div><div class="field"><label>Solução</label><textarea name="solution">${escapeHtml(f.solution)}</textarea></div></div></details><details><summary>5 Porquês e causa raiz</summary><div class="details-body">${[1,2,3,4,5].map(i=>`<div class="field"><label>Por quê ${i}?</label><textarea name="why${i}">${escapeHtml(f[`why${i}`])}</textarea></div>`).join("")}<div class="field"><label>Categoria de causa</label><select name="causeCategory">${selectOptions(["","PEÇA","MÉTODO","FERRAMENTA","INSTALAÇÃO","USO","AMBIENTE","OUTRO SISTEMA"],f.causeCategory)}</select></div><div class="field"><label>Causa raiz provável</label><textarea name="rootCause">${escapeHtml(f.rootCause)}</textarea></div><div class="field"><label>Ação corretiva</label><textarea name="correctiveAction">${escapeHtml(f.correctiveAction)}</textarea></div><div class="field"><label>Ação preventiva</label><textarea name="preventiveAction">${escapeHtml(f.preventiveAction)}</textarea></div><div class="field"><label>Validação</label><textarea name="validation">${escapeHtml(f.validation)}</textarea></div></div></details><details><summary>Impacto</summary><div class="details-body form-grid">${moneyInput("cost","Custo",f.cost)}<div class="field"><label>Tempo parado (dias)</label><input type="number" min="0" name="downtime" value="${attr(f.downtime)}"></div><div class="field"><label>Risco de segurança</label><input name="safetyRisk" value="${attr(f.safetyRisk)}"></div><div class="field"><label>Impacto no uso</label><input name="useImpact" value="${attr(f.useImpact)}"></div><div class="field"><label>Impacto em viagens</label><input name="travelImpact" value="${attr(f.travelImpact)}"></div><div class="field"><label>Impacto na confiabilidade</label><input name="reliabilityImpact" value="${attr(f.reliabilityImpact)}"></div><div class="field wide"><label>Possibilidade de prevenção</label><input name="prevention" value="${attr(f.prevention)}"></div><div class="field"><label>Status</label><select name="status">${selectOptions(["ABERTO","EM ANÁLISE","ACOMPANHAMENTO","ENCERRADO"],f.status)}</select></div></div></details><details><summary>FMEA associada</summary><div class="details-body form-grid"><div class="field"><label>Gravidade (1–10)</label><input type="number" min="1" max="10" name="fmeaSeverity" value="${attr(existing?.fmeaSeverity||5)}"></div><div class="field"><label>Ocorrência (1–10)</label><input type="number" min="1" max="10" name="fmeaOccurrence" value="${attr(existing?.fmeaOccurrence||5)}"></div><div class="field"><label>Detecção (1–10)</label><input type="number" min="1" max="10" name="fmeaDetection" value="${attr(existing?.fmeaDetection||5)}"></div></div></details></form>`;
      openModal(`${existing?"Editar": "Novo"} ${f.type.toLowerCase()}`,body,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="saveFailureBtn">SALVAR E CALCULAR FMEA</button>`,{wide:true});
      byId("failureForm").addEventListener("input",()=>scheduleSave());
      byId("saveFailureBtn").onclick=()=>{const form=byId("failureForm");if(!validateForm(form))return;const data=getFormData(form);["km","cost","downtime","fmeaSeverity","fmeaOccurrence","fmeaDetection"].forEach(k=>data[k]=nonNegative(data[k]));const index=state.failures.findIndex(x=>x.id===data.id);if(index>=0)state.failures[index]={...existing,...data};else state.failures.unshift(data);let fm=state.fmea.find(x=>x.failureId===data.id);if(!fm){fm={id:uid(),failureId:data.id,title:data.title};state.fmea.unshift(fm);}Object.assign(fm,{title:data.title,severity:data.fmeaSeverity,occurrence:data.fmeaOccurrence,detection:data.fmeaDetection,action:data.correctiveAction});let rec=state.records.find(x=>x.failureId===data.id);if(!rec){rec={id:uid(),failureId:data.id};state.records.unshift(rec);}Object.assign(rec,{type:data.type,date:data.date,km:data.km,title:data.title,description:data.description,cost:data.cost});if(state.vehicle&&data.km>nonNegative(state.vehicle.currentKm))state.vehicle.currentKm=data.km;scheduleSave(true);closeModal();navigate("records");toast(`FMEA: NPR ${calculateFmea(fm).npr} — ${calculateFmea(fm).band}.`,calculateFmea(fm).band==="ALTO"?"error":"success");};

      const record=state.records.find(x=>x.id===id);if(!record)return;if(record.failureId){openFailureForm(record.failureId);return;}if(record.fuelLogId){const log=state.fuelLogs.find(x=>x.id===record.fuelLogId);const metric=calculateFuelMetrics().find(x=>x.id===log?.id);openModal(record.title,`<div class="card"><p><strong>${number(log?.liters,2)} l</strong> × ${money(log?.pricePerLiter)} = ${money(log?.total)}</p><p>Posto: ${escapeHtml(log?.station||"Não informado")}<br>Qualidade: ${escapeHtml(log?.quality||"Não informado")}</p><p>Consumo: ${metric?.consumption?`${number(metric.consumption,2)} km/l`:"Aguardando ciclo cheio a cheio"}<br>Custo/km: ${metric?.costKm?money(metric.costKm):"A calcular"}<br>Autonomia real: ${metric?.realRange?`${number(metric.realRange,0)} km`:"A calcular"}</p></div>`,`<button class="btn" data-action="close-modal">FECHAR</button>`);return;}openGenericRecordForm(record.type,record);
    }

    function deleteRecord(id){const r=state.records.find(x=>x.id===id);if(!r||!confirmAction(`Excluir o registro “${r.title||r.type}”?`))return;if(r.failureId){state.failures=state.failures.filter(x=>x.id!==r.failureId);state.fmea=state.fmea.filter(x=>x.failureId!==r.failureId);}if(r.fuelLogId)state.fuelLogs=state.fuelLogs.filter(x=>x.id!==r.fuelLogId);state.records=state.records.filter(x=>x.id!==id);scheduleSave();render();}

    function renderParts() {
      const sorted=[...state.parts].sort((a,b)=>(partPriority(b))-(partPriority(a)));
      return `<div class="page-title"><div><div class="eyebrow">Horizonte de 20 anos</div><h1>Estoque estratégico</h1><p class="muted">Disponibilidade, criticidade, preço e risco de escassez.</p></div><button class="btn primary small" data-action="new-part">NOVA</button></div><section class="grid three"><div class="card metric"><span class="label">Peças cadastradas</span><span class="value">${state.parts.length}</span></div><div class="card metric"><span class="label">Itens armazenados</span><span class="value">${state.parts.filter(x=>x.status==="ARMAZENADA").length}</span></div><div class="card metric"><span class="label">Críticas sem reserva</span><span class="value">${state.parts.filter(x=>x.critical&&nonNegative(x.quantity)<nonNegative(x.minimum)).length}</span></div></section><section class="section"><div class="list">${sorted.length?sorted.map(renderPartCard).join(""):emptyState("Nenhuma peça cadastrada.","Cadastre necessidades imediatas e itens de estoque estratégico.",`<button class="btn primary" data-action="new-part">CADASTRAR PEÇA</button>`)}</div></section><section class="section"><details><summary>Modificações e peças originais removidas</summary><div class="details-body"><button class="btn block" id="newModificationBtn">NOVA MODIFICAÇÃO</button>${state.modifications.length?state.modifications.map(m=>`<div class="list-item section"><strong>${escapeHtml(m.title)}</strong><br><small>${escapeHtml(m.installedPart||"Peça não informada")} · reversível: ${m.reversible?"sim":"não"}</small></div>`).join(""):"<p class='muted section'>Nenhuma modificação registrada.</p>"}</div></details></section>`;
    }

    function partPriority(part){const availability={"FÁCIL":0,"LIMITADA":2,"RARA":4,"INDISPONÍVEL":6}[part.availability]||0;return availability+(part.critical?5:0)+(nonNegative(part.quantity)<nonNegative(part.minimum)?3:0)+clamp(nonNegative(part.scarcityRisk),0,5)-clamp(nonNegative(part.deterioration),0,5);}
    function renderPartCard(p){const quotes=state.partQuotes.filter(q=>q.partId===p.id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const last=quotes.at(-1),prev=quotes.at(-2);const variation=last&&prev&&nonNegative(prev.price)?(nonNegative(last.price)-nonNegative(prev.price))/nonNegative(prev.price)*100:null;return `<article class="card ${p.critical?"attention":""}"><div class="list-item-head"><div><h3>${escapeHtml(p.name)}</h3><small>${escapeHtml(p.manufacturer||"Fabricante não informado")} · ${escapeHtml(p.code||"sem código")}</small></div>${badge(p.status||"PLANEJADA",statusColor(p.status))}</div><div class="chips"><span class="chip">Qtd. ${number(p.quantity,0)}/${number(p.minimum,0)}</span><span class="chip">${p.availability}</span><span class="chip">${p.category}</span><span class="chip">Prioridade ${partPriority(p)}</span></div>${last?`<p><small>Preço atual ${money(last.price)}${variation===null?"":` · variação ${variation>=0?"+":""}${number(variation,1)}%`}</small></p>`:""}<div class="list-actions"><button class="btn small" data-action="part-detail" data-id="${p.id}">ABRIR</button><button class="btn small" data-action="edit-part" data-id="${p.id}">EDITAR</button><button class="btn small danger" data-action="delete-part" data-id="${p.id}">EXCLUIR</button></div></article>`;}

    function openPartForm(id=null) {
      const existing=id?findPart(id):null;const p={id:uid(),name:"",manufacturer:"",code:"",application:"",versions:"",quantity:0,minimum:0,price:0,supplier:"",location:"",status:"PLANEJADA",category:"ESTOQUE ESTRATÉGICO",availability:"FÁCIL",scarcityRisk:0,deterioration:0,critical:false,validity:"",equivalents:[],lifeEstimate:"",installedDate:"",installedKm:"",warranty:"",...(existing||{})};
      openModal(existing?"Editar peça":"Nova peça",`<form id="partForm"><input type="hidden" name="id" value="${p.id}"><div class="form-grid"><div class="field"><label class="required">Nome</label><input required name="name" value="${attr(p.name)}"></div><div class="field"><label>Fabricante</label><input name="manufacturer" value="${attr(p.manufacturer)}"></div><div class="field"><label>Código</label><input name="code" value="${attr(p.code)}"></div><div class="field"><label>Aplicação</label><input name="application" value="${attr(p.application)}"></div><div class="field wide"><label>Versões compatíveis</label><input name="versions" value="${attr(p.versions)}"></div><div class="field"><label>Quantidade</label><input type="number" min="0" name="quantity" value="${p.quantity}"></div><div class="field"><label>Estoque mínimo</label><input type="number" min="0" name="minimum" value="${p.minimum}"></div>${moneyInput("price","Preço da compra",p.price)}<div class="field"><label>Fornecedor desta compra/cotação</label><input name="supplier" value="${attr(p.supplier)}"></div><div class="field"><label>Local armazenado</label><input name="location" value="${attr(p.location)}"></div><div class="field"><label>Status</label><select name="status">${selectOptions(["PLANEJADA","COMPRAR","COMPRADA","RECEBIDA","ARMAZENADA","INSTALADA"],p.status)}</select></div><div class="field"><label>Classificação</label><select name="category">${selectOptions(["USO IMEDIATO","ESTOQUE ESTRATÉGICO"],p.category)}</select></div><div class="field"><label>Disponibilidade</label><select name="availability">${selectOptions(["FÁCIL","LIMITADA","RARA","INDISPONÍVEL"],p.availability)}</select></div><div class="field"><label>Risco de escassez 0–5</label><input type="number" min="0" max="5" name="scarcityRisk" value="${p.scarcityRisk}"></div><div class="field"><label>Risco de deterioração 0–5</label><input type="number" min="0" max="5" name="deterioration" value="${p.deterioration}"></div>${checkbox("critical","Crítica: pode deixar o carro parado",p.critical)}<div class="field"><label>Validade</label><input type="date" name="validity" value="${attr(p.validity)}"></div><div class="field"><label>Vida útil estimada (informada)</label><input name="lifeEstimate" value="${attr(p.lifeEstimate)}"></div><div class="field"><label>Data de instalação</label><input type="date" name="installedDate" value="${attr(p.installedDate)}"></div><div class="field"><label>Km na instalação</label><input type="number" min="0" name="installedKm" value="${attr(p.installedKm)}"></div><div class="field"><label>Garantia</label><input name="warranty" value="${attr(p.warranty)}"></div></div></form>`,`<button class="btn" data-action="close-modal">CANCELAR</button><button class="btn primary" id="savePartBtn">SALVAR</button>`,{wide:true});
      byId("savePartBtn").onclick=()=>{const form=byId("partForm");if(!validateForm(form))return;const data=getFormData(form);["quantity","minimum","price","scarcityRisk","deterioration","installedKm"].forEach(k=>data[k]=nonNegative(data[k]));const duplicate=state.parts.find(x=>x.id!==data.id&&((data.code&&x.code&&x.code.toLowerCase()===data.code.toLowerCase())||(x.name.toLowerCase()===data.name.toLowerCase()&&String(x.manufacturer).toLowerCase()===String(data.manufacturer).toLowerCase())));if(duplicate&&!confirmAction(`Possível duplicidade com “${duplicate.name}” (${duplicate.code||"sem código"}). Salvar mesmo assim?`))return;data.equivalents=existing?.equivalents||[];const index=state.parts.findIndex(x=>x.id===data.id);if(index>=0)state.parts[index]={...existing,...data};else state.parts.unshift(data);if(data.price>0)state.partQuotes.push({id:uid(),partId:data.id,date:localDateISO(),price:data.price,supplier:data.supplier,link:"",availability:data.availability});scheduleSave(true);closeModal();navigate("parts");toast("Peça salva.","success");};
    }

    function openPartDetail(id) {
      const p=findPart(id);if(!p)return;const quotes=state.partQuotes.filter(q=>q.partId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      const body=`<div class="card"><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.manufacturer||"Fabricante não informado")} · ${escapeHtml(p.code||"sem código")}<br>${escapeHtml(p.application||"Aplicação não informada")}<br>Compatíveis: ${escapeHtml(p.versions||"Não informado")}</p><div class="chips"><span class="chip">${p.availability}</span><span class="chip">Qtd. ${p.quantity}</span><span class="chip">Local ${escapeHtml(p.location||"não informado")}</span></div></div><details open><summary>Histórico de preços</summary><div class="details-body">${quotes.length?quotes.map(q=>`<div class="list-item"><div class="list-item-head"><div><strong>${money(q.price)}</strong><br><small>${dateLabel(q.date)} · ${escapeHtml(q.supplier||"fornecedor não informado")}</small></div><span>${escapeHtml(q.availability||"")}</span></div>${q.link?`<a href="${attr(q.link)}" target="_blank" rel="noopener">Abrir cotação</a>`:""}</div>`).join(""):"<p class='muted'>Sem cotações.</p>"}<button class="btn block section" id="newQuoteBtn">NOVA COTAÇÃO</button></div></details><details open><summary>Peças equivalentes</summary><div class="details-body">${p.equivalents?.length?p.equivalents.map(e=>`<div class="list-item"><strong>${escapeHtml(e.name)}</strong><br><small>${e.type} · ${e.directFit?"encaixe direto":"exige adaptação"} · impacto ${escapeHtml(e.reliabilityImpact||"não informado")}</small><p>${escapeHtml(e.adaptation||"")}</p></div>`).join(""):"<p class='muted'>Nenhuma equivalente relacionada.</p>"}<button class="btn block section" id="newEquivalentBtn">RELACIONAR EQUIVALENTE</button></div></details>`;

    function openQuoteForm(partId) { const p=findPart(partId);openModal("Nova cotação",`<form id="quoteForm"><div class="form-grid"><div class="field"><label>Data</label><input type="date" name="date" value="${localDateISO()}"></div>${moneyInput("price","Preço",0)}<div class="field"><label>Fornecedor</label><input name="supplier"></div><div class="field"><label>Link</label><input type="url" name="link"></div><div class="field"><label>Disponibilidade</label><select name="availability">${selectOptions(["FÁCIL","LIMITADA","RARA","INDISPONÍVEL"],p.availability)}</select></div></div></form>`,`<button class="btn" id="backPartBtn">CANCELAR</button><button class="btn primary" id="saveQuoteBtn">SALVAR</button>`);byId("backPartBtn").onclick=()=>openPartDetail(partId);byId("saveQuoteBtn").onclick=()=>{const data=getFormData(byId("quoteForm"));data.id=uid();data.partId=partId;data.price=nonNegative(data.price);state.partQuotes.push(data);scheduleSave();openPartDetail(partId);};}

    function openEquivalentForm(partId) { const p=findPart(partId);openModal("Peça equivalente",`<form id="equivalentForm"><div class="field"><label class="required">Nome / código da alternativa</label><input required name="name"></div><div class="field"><label>Relação</label><select name="type">${selectOptions(["ORIGINAL","ALTERNATIVA","SUBSTITUTA"],"ALTERNATIVA")}</select></div>${checkbox("preferred","Preferencial",false)}${checkbox("directFit","Encaixe direto",true)}<div class="field"><label>Adaptação necessária</label><textarea name="adaptation"></textarea></div><div class="field"><label>Impacto em confiabilidade</label><input name="reliabilityImpact"></div>${checkbox("reversible","Reversível",true)}</form>`,`<button class="btn" id="backPartBtn">CANCELAR</button><button class="btn primary" id="saveEquivalentBtn">SALVAR</button>`);byId("backPartBtn").onclick=()=>openPartDetail(partId);byId("saveEquivalentBtn").onclick=()=>{const form=byId("equivalentForm");if(!validateForm(form))return;p.equivalents=p.equivalents||[];p.equivalents.push({id:uid(),...getFormData(form)});scheduleSave(true);openPartDetail(partId);};}
